<style>
/* ============================================
   霓虹幻想风格 - Neon Fantasy Data Platform
   ============================================ */

/* CSS 变量 - 色彩系统 */
:root {
  /* 主色 */
  --bg-deep: #090A2A;
  --bg-surface: #171047;
  --neon-magenta: #F438B8;
  --neon-cyan: #26D9F2;
  --neon-violet: #8A4DFF;
  --neon-teal: #36E3C1;
  --neon-coral: #FF536A;
  --neon-gold: #F5C76A;
  --text-primary: #F5F4FF;
  --text-secondary: #B5B3D7;

  /* 功能色 */
  --border-dim: rgba(138, 77, 255, 0.15);
  --border-bright: rgba(38, 217, 242, 0.4);
  --glow-magenta: 0 0 20px rgba(244, 56, 184, 0.5);
  --glow-cyan: 0 0 20px rgba(38, 217, 242, 0.5);
  --glow-violet: 0 0 16px rgba(138, 77, 255, 0.4);

  /* 胜率渐变 */
  --win-high: #36E3C1;
  --win-mid: #F5C76A;
  --win-low: #FF536A;
}

/* 全局重置 */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Body - 深靛蓝背景 + 细网格纹理 */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  background-image:
    linear-gradient(rgba(138, 77, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(138, 77, 255, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  position: relative;
  text-decoration: none;
}

/* 全局扫描线效果（极低透明度，不影响阅读）*/
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(38, 217, 242, 0.02) 2px,
    rgba(38, 217, 242, 0.02) 4px
  );
  pointer-events: none;
  z-index: 1;
}

/* ============================================
   导航栏 - 霓虹边框 + 品牌色
   ============================================ */
.navbar {
  background: var(--bg-surface);
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)) 1;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  height: 64px;
  gap: 32px;
  box-shadow: 0 4px 24px rgba(244, 56, 184, 0.15);
}

.logo {
  font-size: 20px;
  font-weight: 800;
  color: var(--neon-magenta);
  letter-spacing: 0.05em;
  white-space: nowrap;
  text-shadow: var(--glow-magenta);
  position: relative;
  text-decoration: none;
}

.logo::before {
  content: '⚡';
  margin-right: 6px;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
}

.nav-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav-tab {
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid transparent;
  background: transparent;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  text-decoration: none;
  display: inline-block;
  font-family: inherit;
}

.nav-tab:hover {
  color: var(--text-primary);
  border-color: var(--border-bright);
  background: rgba(38, 217, 242, 0.08);
}

.nav-tab.active {
  color: var(--text-primary);
  background: linear-gradient(135deg, rgba(244, 56, 184, 0.15), rgba(38, 217, 242, 0.15));
  border-color: var(--neon-magenta);
  box-shadow: var(--glow-magenta);
}

.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
}

/* 主容器 */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px;
  position: relative;
  z-index: 2;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   表单组件 - 输入框、按钮、下拉
   ============================================ */

/* 筛选卡片 - 品红主边框 + 青色角标 */
.form-card {
  background: var(--bg-surface);
  border: 1px solid rgba(244, 56, 184, 0.35);
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 24px;
  position: relative;
  box-shadow: inset 0 0 40px rgba(244, 56, 184, 0.04);
}

/* 青色角标 */
.form-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-cyan);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
  border-radius: 0 8px 0 0;
}

.form-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-magenta);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  background: var(--neon-cyan);
  border-radius: 2px;
  box-shadow: var(--glow-cyan);
}

.form-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

/* 输入框 / 下拉框 */
input, select {
  background: rgba(9, 10, 42, 0.8);
  border: 1px solid rgba(138, 77, 255, 0.3);
  border-radius: 6px;
  padding: 9px 14px;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  min-width: 140px;
  font-family: inherit;
}

input:hover, select:hover {
  border-color: rgba(38, 217, 242, 0.5);
}

input:focus, select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 2px rgba(38, 217, 242, 0.15);
  background: rgba(9, 10, 42, 1);
}

input::placeholder {
  color: rgba(181, 179, 215, 0.4);
}

/* select 选项颜色 */
select option {
  background: var(--bg-surface);
  color: var(--text-primary);
}

/* 按钮系统 */
.btn {
  padding: 9px 22px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-magenta), var(--neon-violet));
  color: #fff;
  box-shadow: 0 4px 16px rgba(244, 56, 184, 0.4);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(244, 56, 184, 0.6);
  filter: brightness(1.1);
}

.btn-primary:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(244, 56, 184, 0.4);
}

.btn-primary:disabled {
  background: rgba(138, 77, 255, 0.15);
  color: var(--text-secondary);
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
  filter: none;
}

/* 热门推荐 chips */
.suggest-title {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  font-weight: 600;
}

.suggest-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid rgba(38, 217, 242, 0.2);
  background: rgba(38, 217, 242, 0.05);
  color: var(--text-secondary);
  transition: all 0.2s;
  font-weight: 500;
}

.chip:hover {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  background: rgba(38, 217, 242, 0.12);
  box-shadow: 0 0 8px rgba(38, 217, 242, 0.3);
}

.chip .cnt {
  font-size: 10px;
  color: rgba(181, 179, 215, 0.5);
  margin-left: 4px;
}

/* ============================================
   结果卡片 - 双色霓虹边框
   ============================================ */

/* 青色主边框 + 品红角标 */
.result-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(38, 217, 242, 0.3);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 24px;
  position: relative;
  box-shadow: 0 0 0 0 transparent, inset 0 0 32px rgba(38, 217, 242, 0.03);
  transition: box-shadow 0.3s;
}

/* 品红角标 */
.result-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 14px;
  height: 14px;
  background: var(--neon-magenta);
  clip-path: polygon(0 0, 100% 0, 0 100%);
  border-radius: 8px 0 0 0;
  z-index: 1;
}

.result-card:hover {
  box-shadow: 0 0 20px rgba(38, 217, 242, 0.12);
}

.result-header {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(38, 217, 242, 0.15);
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(9, 10, 42, 0.4);
}

.total {
  color: var(--neon-cyan);
  font-weight: 700;
  text-shadow: 0 0 8px rgba(38, 217, 242, 0.6);
}

/* 阵容列表项 */
.run-item {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.1);
  display: flex;
  gap: 12px;
  align-items: center;
  transition: background 0.15s;
}

.run-item:hover {
  background: rgba(244, 56, 184, 0.05);
}

.run-item:last-child {
  border-bottom: none;
}

.run-hero {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  background: rgba(244, 56, 184, 0.12);
  color: var(--neon-magenta);
  border: 1px solid rgba(244, 56, 184, 0.35);
}

.run-meta {
  flex: 1;
  min-width: 0;
}

.run-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.run-items {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 胜率徽章 */
.win-badge {
  font-size: 14px;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
  min-width: 48px;
}

.win-badge .sub {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  display: block;
  margin-top: 1px;
}

/* 分页按钮 */
.pagination {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

.page-btn {
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid rgba(138, 77, 255, 0.3);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.page-btn:hover {
  border-color: var(--neon-violet);
  color: var(--neon-violet);
  background: rgba(138, 77, 255, 0.1);
}

.page-btn.active {
  background: var(--neon-violet);
  color: #fff;
  border-color: var(--neon-violet);
  box-shadow: var(--glow-violet);
}

.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* 胜率查询 - 偏电光青 */
.winrate-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(38, 217, 242, 0.3);
  border-radius: 8px;
  padding: 36px;
  text-align: center;
  margin-bottom: 24px;
  position: relative;
}

.winrate-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 14px;
  height: 14px;
  background: var(--neon-magenta);
  clip-path: polygon(0 0, 100% 0, 0 100%);
  border-radius: 8px 0 0 0;
}

.winrate-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.winrate-big {
  font-size: 72px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 8px;
  text-shadow: 0 0 40px currentColor;
}

.winrate-bar-wrap {
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 8px;
  width: 320px;
  margin: 20px auto;
  overflow: hidden;
  position: relative;
}

.winrate-bar-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid rgba(38, 217, 242, 0.2);
  border-radius: 4px;
}

.winrate-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.winrate-bar::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  width: 4px;
  height: 100%;
  background: rgba(255,255,255,0.6);
  border-radius: 0 4px 4px 0;
}

.winrate-stats {
  display: flex;
  gap: 48px;
  justify-content: center;
  margin-top: 24px;
}

.winrate-stat .num {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
}

.winrate-stat .lbl {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* 最佳搭档 - 偏青绿色 */
.partner-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--neon-teal);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 10px 20px 8px;
  border-bottom: 1px solid rgba(54, 227, 193, 0.15);
  background: rgba(54, 227, 193, 0.04);
}

.partner-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.1);
  transition: background 0.15s;
}

.partner-item:hover {
  background: rgba(54, 227, 193, 0.05);
}

.partner-item:last-child {
  border-bottom: none;
}

.partner-rank {
  font-size: 18px;
  width: 28px;
  text-align: center;
  color: var(--text-secondary);
  font-weight: 700;
}

.partner-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.partner-rate {
  font-size: 15px;
  font-weight: 800;
}

.partner-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.partner-bar-wrap {
  width: 80px;
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 5px;
  overflow: hidden;
}

.partner-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  background: var(--neon-teal);
  box-shadow: 0 0 6px var(--neon-teal);
}

/* 职业榜单 - 偏紫罗兰 */
.topcard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  margin-top: 0;
}

.topcard-hero-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(138, 77, 255, 0.35);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.topcard-hero-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-violet);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
  border-radius: 0 8px 0 0;
}

.topcard-hero-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.2);
  background: rgba(9, 10, 42, 0.5);
}

.topcard-hero-name {
  font-size: 15px;
  font-weight: 800;
  color: var(--neon-violet);
  text-shadow: var(--glow-violet);
}

.topcard-hero-runs {
  font-size: 11px;
  color: var(--text-secondary);
}

.topcard-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.08);
  transition: background 0.15s;
}

.topcard-item:hover {
  background: rgba(138, 77, 255, 0.05);
}

.topcard-item:last-child {
  border-bottom: none;
}

.topcard-rank {
  font-size: 16px;
  width: 24px;
  text-align: center;
  flex-shrink: 0;
  color: var(--text-secondary);
  font-weight: 700;
}

.topcard-name {
  flex: 1;
  min-width: 0;
}

.topcard-name-zh {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topcard-name-en {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topcard-rate-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.topcard-rate {
  font-size: 14px;
  font-weight: 800;
}

.topcard-sub {
  font-size: 10px;
  color: var(--text-secondary);
}

.topcard-bar-wrap {
  width: 60px;
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 4px;
  overflow: hidden;
}

.topcard-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

/* 意见反馈 - 偏珊瑚红和品红 */
.fb-form-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-coral);
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.fb-form-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  background: var(--neon-magenta);
  border-radius: 2px;
  box-shadow: var(--glow-magenta);
}

.fb-textarea {
  width: 100%;
  min-height: 100px;
  background: rgba(9, 10, 42, 0.8);
  border: 1px solid rgba(255, 83, 106, 0.3);
  border-radius: 6px;
  padding: 12px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: all 0.2s;
  margin-bottom: 10px;
}

.fb-textarea:focus {
  border-color: var(--neon-coral);
  box-shadow: 0 0 0 2px rgba(255, 83, 106, 0.15);
  background: rgba(9, 10, 42, 1);

      <div class="form-group">
        <label>最低胜场</label>
        <select id="runs-wins">
          <option value="10">10胜</option>
          <option value="9">9胜</option>
          <option value="8">8胜</option>
          <option value="7">7胜</option>
          <option value="1">全部</option>
        </select>
      </div>
      <div class="form-group">
        <label>天数</label>
        <input id="runs-days" type="number" placeholder="不限" min="1" style="width:90px">
      </div>
      <div class="form-group">
        <label>段位</label>
        <select id="runs-rank">
          <option value="all" selected>全部段位</option>
          <option value="legendary">传奇</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="queryRuns(1)">查询</button>
    </div>
  </div>
  <div id="runs-error"></div>
  <div class="view-toggle" id="view-toggle">
    <button class="view-toggle-btn" onclick="setViewMode('comp')">🔍 阵容分析</button>
    <button class="view-toggle-btn active" onclick="setViewMode('list')">📋 阵容列表</button>
  </div>
  <div id="runs-result"></div>
  <div id="comp-result"></div>
</div>
</div>
<script>
const HEROES = {凡妮莎:'Vanessa',杜利:'Dooley',马克:'Mak',皮格:'Pygmalien',斯黛拉:'Stelle',朱尔斯:'Jules',卡诺克:'Karnok',双龙:'The Dragons'};
let lastQuery = 0;
// 初始化视图状态
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('comp-result').style.display = 'none';
  document.getElementById('comp-result').innerHTML = '<div class="result-card"><div class="empty">输入卡牌名称后点击查询，即可查看阵容分析</div></div>';
});

function switchTab(tab) {
  if (tab === "topcard" && !window._topcardLoaded) { setTimeout(loadTopcard, 0); }
  if (tab === "feedback" && !_fbLoaded) { setTimeout(() => loadFeedback(true), 0); }
  trackPV(tab);
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    t.classList.toggle('active', ['runs','winrate','partner','topcard','feedback'][i]===tab);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

function checkRate() {
  const now = Date.now();
  if (now - lastQuery < 3000) {
    const wait = ((3000-(now-lastQuery))/1000).toFixed(1);
    return `请等待 ${wait} 秒后再查询`;
  }
  lastQuery = now;
  return null;
}

function showError(id, msg) {
  document.getElementById(id).innerHTML = msg ? `<div class="error-msg">${msg}</div>` : '';
}

function winrateColor(r) {
  if (r >= 0.7) return '#10b981';
  if (r >= 0.5) return '#f59e0b';
  return '#ef4444';
}

async function queryRuns(page) {
  const err = checkRate();
  if (err) { showError('runs-error', err); return; }
  showError('runs-error', '');
  const hero = document.getElementById('runs-hero').value;
  const cards = document.getElementById('runs-cards').value.trim();
  const wins = document.getElementById('runs-wins').value;
  const days = document.getElementById('runs-days').value;
  const rank = document.getElementById('runs-rank').value;
  // 阵容分析模式
  if (_viewMode === 'comp') {
    document.getElementById('runs-result').style.display = 'none';
    document.getElementById('comp-result').style.display = '';
    await queryComp();
    return;
  }
  document.getElementById('runs-result').style.display = '';
  document.getElementById('comp-result').style.display = 'none';
  const _runsEl = document.getElementById('runs-result');
  _runsEl.innerHTML = `<div class="runs-progress-wrap">
    <div class="runs-progress-label">正在查询阵容数据，请稍候...</div>
    <div class="runs-progress-bar-bg"><div class="runs-progress-bar" id="runs-pbar"></div></div>
    <div class="runs-progress-label" id="runs-pct">0%</div>
  </div>`;
  let _runsPct = 0;
  const _runsTimer = setInterval(() => {
    if (_runsPct < 80) {
      _runsPct += _runsPct < 30 ? 3 : _runsPct < 60 ? 1.5 : 0.5;
      const bar = document.getElementById('runs-pbar');
      const lbl = document.getElementById('runs-pct');
      if (bar) bar.style.width = _runsPct.toFixed(0) + '%';
      if (lbl) lbl.textContent = _runsPct.toFixed(0) + '%';
    }
  }, 200);
  const params = new URLSearchParams({min_wins: wins, page, rank});
  if (hero) params.set('hero', hero);
  if (cards) params.set('cards', cards);
  if (days) params.set('days', days);
  try {
    const res = await fetch('/api/runs?' + params);
    const data = await res.json();
    clearInterval(_runsTimer);
    const bar = document.getElementById('runs-pbar');
    const lbl = document.getElementById('runs-pct');
    if (bar) bar.style.width = '100%';
    if (lbl) lbl.textContent = '100%';
    await new Promise(res => setTimeout(res, 300));
    if (data.error) { showError('runs-error', data.error); _runsEl.innerHTML=''; return; }
    renderRuns(data, page, {hero, cards, wins, days});
  } catch(e) { clearInterval(_runsTimer); showError('runs-error', '请求失败: '+e.message); _runsEl.innerHTML=''; }
}

function renderRuns(data, page, params) {
  const {runs, total, pages} = data;
  if (!runs || runs.length === 0) {
    document.getElementById('runs-result').innerHTML = '<div class="result-card"><div class="empty">未找到符合条件的阵容</div></div>';
    return;
  }
  const heroZh = {Vanessa:'凡妮莎',Dooley:'杜利',Mak:'马克',Pygmalien:'皮格',Stelle:'斯黛拉',Jules:'朱尔斯',Karnok:'卡诺克','The Dragons':'双龙'};
  let items = runs.map(r => {
    const day = r.wins + r.losses;
    const itemsStr = r.items.slice(0,5).join('、') + (r.items.length>5?` +${r.items.length-5}`:'');
    const screenshot = r.screenshot ? `<div style="margin:8px 0 2px"><img src="${r.screenshot}" style="max-width:100%;border-radius:6px;border:1px solid #1f2937" loading="lazy" onerror="this.style.display='none'"></div>` : '';
    const timeStr = r.created_at ? new Date(r.created_at).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="run-item" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;gap:12px;align-items:center;width:100%">
        <span class="run-hero">${heroZh[r.hero]||r.hero}</span>
        <div class="run-meta">
          <div class="run-title">Day${day} · ${r.username||'匿名'}${timeStr ? ' · <span style="color:var(--text-secondary);font-size:11px">' + timeStr + '</span>' : ''}</div>
          <div class="run-items">${itemsStr}</div>
        </div>
        <span class="win-badge">${r.wins}胜${r.losses}负</span>
        <a class="run-link" href="${r.url}" target="_blank">查看 →</a>
      </div>
      ${screenshot}
    </div>`;
  }).join('');

  let pagination = '';
  if (pages > 1) {
    const btns = [];
    for (let i = 1; i <= Math.min(pages, 10); i++) {
      btns.push(`<button class="page-btn${i===page?' active':''}" onclick="queryRuns(${i})">${i}</button>`);
    }
    pagination = `<div class="pagination">${btns.join('')}</div>`;
  }

  document.getElementById('runs-result').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <span>阵容列表</span>
        <span class="total">共 ${total} 条结果（第 ${page}/${pages} 页）</span>
      </div>
      ${items}
      ${pagination}
    </div>`;
}

async function queryWinrate() {
  const err = checkRate();
  if (err) { showError('wr-error', err); return; }
  showError('wr-error', '');
  const cards = document.getElementById('wr-cards').value.trim();
  const hero = document.getElementById('wr-hero').value;
  const days = document.getElementById('wr-days').value;
  if (!cards) { showError('wr-error', '请输入至少一张卡牌'); return; }
  document.getElementById('wr-result').innerHTML = '<div class="loading">查询中...</div>';
  const params = new URLSearchParams({cards});
  if (hero) params.set('hero', hero);
  if (days) params.set('days', days);
  try {
    const res = await fetch('/api/winrate?' + params);
    const data = await res.json();
    if (data.error) { showError('wr-error', data.error); document.getElementById('wr-result').innerHTML=''; return; }
    renderWinrate(data);
  } catch(e) { showError('wr-error', '请求失败: '+e.message); document.getElementById('wr-result').innerHTML=''; }
}

function renderWinrate(data) {
  const {card_names, not_found, total, ten_win, rate} = data;
  if (total === 0) {
    document.getElementById('wr-result').innerHTML = '<div class="result-card"><div class="empty">暂无数据</div></div>';
    return;
  }
  const color = winrateColor(rate);
  const pct = (rate*100).toFixed(1);
  const title = card_names.join(' + ') || '查询卡牌';
  let notFoundHtml = not_found && not_found.length ? `<div style="color:#f87171;font-size:12px;margin-top:12px">未识别: ${not_found.join(', ')}</div>` : '';
  document.getElementById('wr-result').innerHTML = `
    <div class="winrate-card">
      <div class="winrate-title">${title} 的10胜率</div>
      <div class="winrate-big" style="color:${color}">${pct}%</div>
      <div class="winrate-bar-wrap"><div class="winrate-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="winrate-stats">
        <div class="winrate-stat"><div class="num">${ten_win}</div><div class="lbl">10胜局数</div></div>
        <div class="winrate-stat"><div class="num">${total}</div><div class="lbl">含该卡总局数</div></div>
      </div>
      ${notFoundHtml}
    </div>`;
}

async function queryPartner() {
  const err = checkRate();
  if (err) { showError('pt-error', err); return; }
  showError('pt-error', '');
  const card = document.getElementById('pt-card').value.trim();
  const days = document.getElementById('pt-days').value;
  if (!card) { showError('pt-error', '请输入卡牌名称'); return; }
  document.getElementById('pt-result').innerHTML = '<div class="loading">查询中...</div>';
  const params = new URLSearchParams({card});
  if (days) params.set('days', days);
  try {
    const res = await fetch('/api/partner?' + params);
    const data = await res.json();
    if (data.error) { showError('pt-error', data.error); document.getElementById('pt-result').innerHTML=''; return; }
    renderPartner(data);
  } catch(e) { showError('pt-error', '请求失败: '+e.message); document.getElementById('pt-result').innerHTML=''; }
}

function renderPartner(data) {
  const {card_name, by_winrate, by_appear, target_total} = data;
  if (!by_winrate.length && !by_appear.length) {
    document.getElementById('pt-result').innerHTML = '<div class="result-card"><div class="empty">暂无满足条件的搭档数据（需至少50次共现）</div></div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];

  function renderList(items, rateKey, rateLabel, barColor) {
    return items.map((p,i) => {
      const rate = p[rateKey];
      const pct = (rate*100).toFixed(1);
      const sub = rateKey === 'rate'
        ? `${p.ten_win}/${p.total} 局`
        : `${p.total}/${target_total} 局`;
      return `<div class="partner-item">
        <span class="partner-rank">${medals[i]}</span>
        <div style="flex:1">
          <div class="partner-name">${p.name}</div>
          <div class="partner-sub">${sub}</div>
        </div>
        <div style="text-align:right">
          <div class="partner-rate" style="color:${winrateColor(rate)}">${pct}%</div>
          <div class="partner-sub">${rateLabel}</div>
        </div>
        <div class="partner-bar-wrap"><div class="partner-bar" style="width:${Math.min(pct,100)}%;background:${winrateColor(rate)}"></div></div>
      </div>`;
    }).join('');
  }

  document.getElementById('pt-result').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <span>${card_name} 最佳搭档</span>
        <span class="total">含该卡共 ${target_total} 局</span>
      </div>
      <div class="partner-section-title">📈 胜率榜 TOP3</div>
      ${renderList(by_winrate, 'rate', '10胜率', '#10b981')}
      <div class="partner-section-title" style="margin-top:4px">🔗 组合率榜 TOP3</div>
      ${renderList(by_appear, 'appear_rate', '组合率', '#3b82f6')}
    </div>`;
}

// Enter 键触发查询
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.panel.active').id;
  if (active === 'panel-runs') queryRuns(1);
  else if (active === 'panel-winrate') queryWinrate();
  else if (active === 'panel-partner') queryPartner();
});

function loadSuggestions() {
  fetch('/api/suggestions')
    .then(r => r.json())
    .then(data => {
      const heroes = data.heroes || [];
      const cards = data.cards || [];
      if (!heroes.length && !cards.length) return;
      document.getElementById('suggest-area').style.display = 'block';
      document.getElementById('suggest-heroes').innerHTML = heroes.map(h =>
        `<span class="chip" onclick="applySuggestion('hero','${h.name}')">${h.name}<span class="cnt">${h.count}</span></span>`
      ).join('');
      document.getElementById('suggest-cards').innerHTML = cards.map(c =>
        `<span class="chip" onclick="applySuggestion('card','${c.name}')">${c.name}<span class="cnt">${c.count}</span></span>`
      ).join('');
    }).catch(() => {});
}

function applySuggestion(type, val) {
  const activeTab = document.querySelector('.nav-tab.active').textContent.trim();
  const isRuns = activeTab.includes('阵容');
  const isWinrate = activeTab.includes('胜率');
  if (type === 'hero') {
    const selId = isRuns ? 'runs-hero' : 'winrate-hero';
    const sel = document.getElementById(selId);
    if (sel) Array.from(sel.options).forEach(o => { if (o.text === val) sel.value = o.value; });
  } else {
    const inpId = isRuns ? 'runs-cards' : isWinrate ? 'winrate-cards' : 'partner-card';
    const inp = document.getElementById(inpId);
    if (inp) inp.value = val;
  }
}
const TC_HEROES = [
  {key:'Vanessa', zh:'海盗 · 凡妮莎'},
  {key:'Dooley',  zh:'工程师 · 杜利'},
  {key:'Mak',     zh:'法师 · 马克'},
  {key:'Pygmalien',zh:'猪猪 · 皮格'},
  {key:'Stelle',  zh:'机甲 · 斯黛拉'},
  {key:'Jules',   zh:'吸血鬼 · 朱尔斯'},
  {key:'Karnok',  zh:'兽人 · 卡诺克'},
  {key:'The Dragons', zh:'双龙'},
];
const RANK_ICONS = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
window._topcardLoaded = false;

function tcRateColor(r) {
  if (r >= 0.6) return '#10b981';
  if (r >= 0.45) return '#f59e0b';
  return '#ef4444';
}

async function loadTopcard() {
  const n = document.getElementById('topcard-n').value;
  const days = document.getElementById('topcard-days').value;
  const el = document.getElementById('topcard-result');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const results = await Promise.all(TC_HEROES.map(h => {
      let url = '/api/topcard?hero=' + encodeURIComponent(h.key) + '&top=' + n;
      if (days) url += '&days=' + days;
      return fetch(url).then(r => r.json()).then(data => ({hero: h, data}));
    }));
    el.innerHTML = '<div class="topcard-grid">' + results.map(({hero, data}) => {
      const top = data.top || [];
      const rows = top.map((item, i) => {
        const rate = item.rate || 0;
        const barW = Math.min(Math.round(rate * 100), 100);
        const color = tcRateColor(rate);
        const nameEn = item.name_zh !== item.name_en ? item.name_en : '';
        return '<div class="topcard-item">' +
          '<div class="topcard-rank">' + (RANK_ICONS[i] || (i+1)) + '</div>' +
          '<div class="topcard-name">' +
            '<div class="topcard-name-zh">' + item.name_zh + '</div>' +
            (nameEn ? '<div class="topcard-name-en">' + nameEn + '</div>' : '') +
          '</div>' +
          '<div class="topcard-rate-wrap">' +
            '<div class="topcard-rate" style="color:' + color + '">' + (rate*100).toFixed(1) + '%</div>' +
            '<div class="topcard-sub">' + item.ten_win + '胜/' + item.total + '局</div>' +
            '<div class="topcard-bar-wrap"><div class="topcard-bar" style="width:' + barW + '%;background:' + color + '"></div></div>' +
          '</div>' +
        '</div>';
      }).join('');
      const empty = top.length === 0 ? '<div class="empty">暂无数据</div>' : '';
      return '<div class="topcard-hero-card">' +
        '<div class="topcard-hero-header">' +
          '<div class="topcard-hero-name">' + hero.zh + '</div>' +
          '<div class="topcard-hero-runs">' + (data.total_runs || 0) + ' 局</div>' +
        '</div>' +
        rows + empty +
      '</div>';
    }).join('') + '</div>';
    window._topcardLoaded = true;
  } catch(e) {
    el.innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

let _fbPage = 1, _fbLoaded = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function maskContact(s) {
  if (!s) return '';
  s = s.trim();
  if (s.includes('@')) {
    const at = s.indexOf('@');
    const local = s.slice(0, at);
    const domain = s.slice(at);
    if (local.length <= 2) return local[0] + '***' + domain;
    return local[0] + '***' + local.slice(-1) + domain;
  }
  if (/^\d+$/.test(s)) {
    if (s.length <= 4) return s[0] + '***';
    return s.slice(0, 2) + '***' + s.slice(-2);
  }
  if (s.length <= 3) return s[0] + '***';
  return s.slice(0, 2) + '***' + s.slice(-1);
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('fb-preview');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.querySelector('.fb-upload-hint').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function submitFeedback() {
  const content = document.getElementById('fb-content').value.trim();
  if (!content) { alert('请输入内容'); return; }
  const fd = new FormData();
  fd.append('content', content);
  const contact = document.getElementById('fb-contact').value.trim();
  if (contact) fd.append('contact', contact);
  const fileInput = document.getElementById('fb-img-input');
  if (fileInput.files[0]) fd.append('image', fileInput.files[0]);
  const btn = document.querySelector('.fb-submit-btn');
  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const resp = await fetch('/api/feedback', {method:'POST', body:fd});
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.error || '提交失败'); }
    document.getElementById('fb-success').style.display = 'block';
    setTimeout(() => document.getElementById('fb-success').style.display = 'none', 3000);
    document.getElementById('fb-content').value = '';
    document.getElementById('fb-contact').value = '';
    document.getElementById('fb-preview').style.display = 'none';
    document.querySelector('.fb-upload-hint').style.display = '';
    fileInput.value = '';
    _fbPage = 1; await loadFeedback(true);
  } catch(e) { alert(e.message); }
  finally { btn.disabled = false; btn.textContent = '提交反馈'; }
}

async function loadFeedback(reset) {
  if (reset) _fbPage = 1;
  try {
    const resp = await fetch('/api/feedback?page=' + _fbPage);
    const data = await resp.json();
    const list = document.getElementById('fb-list');
    if (reset) list.innerHTML = '';
    if (!data.items || data.items.length === 0) {
      if (reset) list.innerHTML = '<div class="fb-empty">还没有反馈，快来抢沙发吧！</div>';
      document.getElementById('fb-loadmore').style.display = 'none';
      return;
    }
    data.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'fb-card'; card.dataset.id = item.id;
      const imgHtml = item.image_path ? '<img class="fb-card-img" src="' + item.image_path + '" loading="lazy">' : '';
      const contactHtml = item.contact ? '<div class="fb-card-contact">📬 ' + maskContact(escapeHtml(item.contact)) + '</div>' : '';
      const time = new Date(item.created_at + (item.created_at.includes('+') ? '' : ' UTC')).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      card.innerHTML = imgHtml +
        '<div class="fb-card-body">' +
          '<div class="fb-card-text">' + escapeHtml(item.content) + '</div>' +
          contactHtml +
          '<div class="fb-card-footer">' +
            '<span class="fb-card-time">' + time + '</span>' +
            '<button class="fb-like-btn" onclick="likeFeedback(' + item.id + ',this)">❤️ <span>' + item.likes + '</span></button>' +
            '<button class="fb-comment-btn" onclick="toggleComments(' + item.id + ')">💬 评论</button>' +
          '</div>' +
        '</div>' +
        '<div class="fb-comments-area" id="comments-' + item.id + '"></div>';
      list.appendChild(card);
    });
    _fbPage++;
    document.getElementById('fb-loadmore').style.display = (data.page < data.pages) ? 'block' : 'none';
    _fbLoaded = true;
  } catch(e) { console.error(e); }
}

async function likeFeedback(id, btn) {
  if (btn.classList.contains('liked')) return;
  try {
    const resp = await fetch('/api/feedback/' + id + '/like', {method:'POST'});
    const data = await resp.json();
    btn.querySelector('span').textContent = data.likes;
    btn.classList.add('liked');
  } catch(e) {}
}

async function toggleComments(id) {
  const area = document.getElementById('comments-' + id);
  if (area.style.display === 'block') { area.style.display = 'none'; return; }
  area.style.display = 'block';
  if (area.dataset.loaded) return;
  try {
    const resp = await fetch('/api/feedback/' + id + '/comments');
    const comments = await resp.json();
    area.innerHTML =
      '<div id="cmtlist-' + id + '"></div>' +
      '<div class="fb-comment-form">' +
        '<input class="fb-comment-input" placeholder="说点什么..." id="cmtinput-' + id + '" ' +
        'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postComment(' + id + ',null)}">' +
        '<button class="fb-comment-submit" onclick="postComment(' + id + ',null)">发送</button>' +
      '</div>';
    renderComments(id, comments, null, document.getElementById('cmtlist-' + id));
    area.dataset.loaded = 'true';
  } catch(e) {}
}

function renderComments(fbId, allComments, parentId, container) {
  const children = allComments.filter(c => c.parent_id === parentId);
  children.forEach(c => {
    const time = new Date(c.created_at + (c.created_at.includes('+') ? '' : ' UTC')).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const div = document.createElement('div');
    div.className = 'fb-comment-item'; div.id = 'cmt-' + c.id;
    div.innerHTML =
      '<div class="fb-comment-content">' + escapeHtml(c.content) + '</div>' +
      '<div class="fb-comment-meta">' +
        '<span>' + time + '</span>' +
        '<button class="fb-reply-btn" onclick="startReply(' + fbId + ',' + c.id + ')">回复</button>' +
      '</div>' +
      '<div class="fb-comment-children" id="children-' + c.id + '"></div>';
    container.appendChild(div);
    renderComments(fbId, allComments, c.id, document.getElementById('children-' + c.id));
  });
}

function startReply(fbId, parentId) {
  const existing = document.getElementById('reply-form-' + parentId);
  if (existing) { existing.remove(); return; }
  const cmt = document.getElementById('cmt-' + parentId);
  if (!cmt) return;
  const form = document.createElement('div');
  form.id = 'reply-form-' + parentId;
  form.className = 'fb-comment-form';
  form.style.marginTop = '6px';
  form.innerHTML =
    '<input class="fb-comment-input" placeholder="回复..." id="replyinput-' + parentId + '" ' +
    'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postComment(' + fbId + ',' + parentId + ')}">' +
    '<button class="fb-comment-submit" onclick="postComment(' + fbId + ',' + parentId + ')">发送</button>';
  cmt.appendChild(form);
  document.getElementById('replyinput-' + parentId).focus();
}

async function postComment(fbId, parentId) {
  const inputId = parentId ? 'replyinput-' + parentId : 'cmtinput-' + fbId;
  const input = document.getElementById(inputId);
  if (!input) return;
  const content = input.value.trim();
  if (!content) return;
  try {
    const resp = await fetch('/api/feedback/' + fbId + '/comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, parent_id: parentId || null})
    });
    if (!resp.ok) throw new Error('发送失败');
    const cmt = await resp.json();
    input.value = '';
    if (parentId) {
      const form = document.getElementById('reply-form-' + parentId);
      if (form) form.remove();
      const childrenEl = document.getElementById('children-' + parentId);
      if (childrenEl) renderComments(fbId, [cmt], parentId, childrenEl);
    } else {
      const list = document.getElementById('cmtlist-' + fbId);
      if (list) renderComments(fbId, [cmt], null, list);
    }
  } catch(e) { alert(e.message); }
}

function loadMoreFeedback() { loadFeedback(false); }


// ── 匿名 fingerprint ──
function getFingerprint() {
  let fp = localStorage.getItem('_bz_fp');
  if (!fp) {
    fp = 'fp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('_bz_fp', fp);
  }
  return fp;
}

// 全局覆盖 fetch，自动带上 fingerprint
const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (typeof opts.headers === 'object' && !(opts.headers instanceof Headers)) {
    opts.headers['X-Fingerprint'] = getFingerprint();
  }
  return _origFetch(url, opts);
};

// Tab PV 上报

  fetch('/api/track/pv', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({tab})
  }).catch(() => {});
}

// ===== 阵容分析视图 =====
let _viewMode = 'list'; // 'comp' | 'list'

function toggleScreenshotComp(id) {
  const el = document.getElementById(id);
  const icon = document.getElementById(id + '-icon');
  if (!el) return;
  const visible = el.style.display !== 'none';
  el.style.display = visible ? 'none' : 'block';
  if (icon) icon.textContent = visible ? '▼' : '▲';
}

function setViewMode(mode) {
  _viewMode = mode;
  document.querySelectorAll('.view-toggle-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && mode === 'comp') || (i === 1 && mode === 'list'));
  });
  document.getElementById('runs-result').style.display = mode === 'list' ? '' : 'none';
  const cardInput = document.getElementById('runs-cards');
  if (cardInput) {
    if (mode === 'comp') {
      cardInput.placeholder = '阵容分析仅支持一张卡，如：火药桶';
    } else {
      cardInput.placeholder = '如：火炮阵列+赛博铁尺';
    }
  }
  document.getElementById('comp-result').style.display = mode === 'comp' ? '' : 'none';
}

function rateColorComp(r) {
  if (r >= 0.7) return '#10b981';
  if (r >= 0.5) return '#f59e0b';
  return '#ef4444';
}

const HERO_ZH_COMP = {Vanessa:'凡妮莎',Dooley:'杜利',Mak:'马克',Pygmalien:'皮格',Stelle:'斯黛拉',Jules:'朱尔斯',Karnok:'卡诺克','The Dragons':'双龙'};

async function queryComp() {
  const card = document.getElementById('runs-cards').value.trim().split('+')[0].trim();
  const hero = document.getElementById('runs-hero').value;
  const rank = document.getElementById('runs-rank').value;
  if (!card) {
    document.getElementById('comp-result').innerHTML = '<div class="result-card"><div class="empty">请输入卡牌名称后查询阵容分析</div></div>';
    return;
  }
  const _compEl = document.getElementById('comp-result');
  _compEl.innerHTML = `<div class="runs-progress-wrap">
    <div class="runs-progress-label">正在分析阵容数据，请稍候...</div>
    <div class="runs-progress-bar-bg"><div class="runs-progress-bar" id="comp-pbar"></div></div>
    <div class="runs-progress-label" id="comp-pct">0%</div>
  </div>`;
  let _compPct = 0;
  const _compTimer = setInterval(() => {
    if (_compPct < 80) {
      _compPct += _compPct < 30 ? 3 : _compPct < 60 ? 1.5 : 0.5;
      const bar = document.getElementById('comp-pbar');
      const lbl = document.getElementById('comp-pct');
      if (bar) bar.style.width = _compPct.toFixed(0) + '%';
      if (lbl) lbl.textContent = _compPct.toFixed(0) + '%';
    }
  }, 200);
  const params = new URLSearchParams({card, rank});
  if (hero) params.set('hero', hero);
  try {
    const res = await fetch('/api/comp/card?' + params);
    const data = await res.json();
    clearInterval(_compTimer);
    const bar = document.getElementById('comp-pbar');
    const lbl = document.getElementById('comp-pct');
    if (bar) bar.style.width = '100%';
    if (lbl) lbl.textContent = '100%';
    await new Promise(res => setTimeout(res, 300));
    if (data.error) { _compEl.innerHTML = `<div class="error-msg">${data.error}</div>`; return; }
    renderCompCard(data);
  } catch(e) {
    clearInterval(_compTimer);
    _compEl.innerHTML = `<div class="error-msg">请求失败: ${e.message}</div>`;
  }
}

function renderCompCard(data) {
  const layers = data.layers || [];
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];

  function screenshotBtnComp(id, url) {
    if (!url) return '';
    const fullUrl = url.startsWith('http') ? url : 'https://usercontent.bzdb.network' + url;
    return `<div style="margin-top:8px">
      <button onclick="toggleScreenshotComp('${id}')" style="background:none;border:1px solid rgba(38,217,242,0.3);border-radius:4px;color:var(--text-secondary);font-size:11px;padding:3px 10px;cursor:pointer;font-family:inherit;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--neon-cyan)';this.style.color='var(--neon-cyan)'" onmouseout="this.style.borderColor='rgba(38,217,242,0.3)';this.style.color='var(--text-secondary)'">
        📷 查看截图 <span id="${id}-icon">▼</span>
      </button>
      <div id="${id}" style="display:none;margin-top:8px">
        <img src="${fullUrl}" style="max-width:100%;border-radius:6px;border:1px solid rgba(138,77,255,0.3)" loading="lazy" onerror="this.parentElement.style.display='none'">
      </div>
    </div>`;
  }

  function chips(cards) {
    return (cards||[]).map(c => {
      const sizeCls = 'size-' + (c.size || 'Small');
      if (c.img) {
        const cls = c.is_new ? 'comp-card-chip has-img is-new' : 'comp-card-chip has-img';
        return `<span class="${cls}"><img class="comp-card-img ${sizeCls}" src="${c.img}" alt="${c.name_zh}" loading="lazy" onerror="this.style.display='none'">${c.name_zh}</span>`;
      }
      return `<span class="${c.is_new ? 'comp-card-chip is-new' : 'comp-card-chip'}">${c.name_zh}</span>`;
    }).join('');
  }

  function renderConfigs(configs, prefix) {
    if (!configs || !configs.length) return '<div style="font-size:12px;color:var(--text-secondary);padding:8px 0">暂无具体配置数据</div>';
    return configs.map((cfg, k) => {
      const id = `${prefix}-cfg-${k}`;
      const cardHtml = chips(cfg.cards);
      return `<div class="comp-variant-item">
        <div class="variant-header">
          <span class="variant-label">配置 ${k+1}</span>
          <div class="variant-stats">
            <span class="variant-rate" style="color:${rateColorComp(cfg.rate)}">${(cfg.rate*100).toFixed(1)}% 胜率</span>
            <span class="variant-count">${cfg.count}次出场</span>
          </div>
        </div>
        <div class="comp-rep-cards" style="margin-top:6px;flex-wrap:wrap">${cardHtml}</div>
        ${screenshotBtnComp(id, cfg.screenshot)}
      </div>`;
    }).join('');
  }

  function renderL3(l3list, prefix) {
    if (!l3list || !l3list.length) return '';
    return l3list.map((l3, k) => {
      const id = `${prefix}-l3-${k}`;
      const cfgHtml = renderConfigs(l3.configs, id);
      return `<div class="comp-group" id="${id}" style="margin:8px 0;border-color:rgba(38,217,242,0.25)">
        <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')" style="background:rgba(9,10,42,0.5);padding:10px 16px">
          <span style="font-size:12px;color:var(--text-secondary);flex-shrink:0">L3</span>
          <div class="comp-rep-cards" style="flex:1">${chips(l3.core_cards)}</div>
          <div class="comp-stats">
            <div>
              <div class="comp-rate" style="color:${rateColorComp(l3.rate)};font-size:14px">${(l3.rate*100).toFixed(1)}%</div>
              <div class="comp-count">${l3.count}次</div>
            </div>
            <span class="comp-expand-icon">▼</span>
          </div>
        </div>
        <div class="comp-variants" style="padding:12px 16px;background:rgba(0,0,0,0.2)">${cfgHtml}</div>
      </div>`;
    }).join('');
  }

  function renderL2(l2list, prefix) {
    if (!l2list || !l2list.length) return '<div style="font-size:12px;color:var(--text-secondary);padding:8px">暂无变种数据</div>';
    return l2list.map((l2, j) => {
      const id = `${prefix}-l2-${j}`;
      const l3Html = renderL3(l2.l3_variants, id);
      const l2InnerHtml = l3Html || renderConfigs(l2.configs, id);
      return `<div class="comp-group" id="${id}" style="margin:8px 0;border-color:rgba(244,56,184,0.25)">
        <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')" style="background:rgba(9,10,42,0.45);padding:10px 16px">
          <span style="font-size:12px;color:var(--text-secondary);flex-shrink:0">L2</span>
          <div class="comp-rep-cards" style="flex:1">${chips(l2.core_cards)}</div>
          <div class="comp-stats">
            <div>
              <div class="comp-rate" style="color:${rateColorComp(l2.rate)};font-size:14px">${(l2.rate*100).toFixed(1)}%</div>
              <div class="comp-count">${l2.count}次</div>
            </div>
            <span class="comp-expand-icon">▼</span>
          </div>
        </div>
        <div class="comp-variants" style="padding:12px 16px">${l2InnerHtml || '<div style="font-size:12px;color:var(--text-secondary)">暂无数据</div>'}</div>
      </div>`;
    }).join('');
  }

  if (!layers.length) {
    document.getElementById('comp-result').innerHTML = '<div class="result-card"><div class="empty">数据不足，无法生成阵容分析（至少需要10局含该卡的记录）</div></div>';
    return;
  }

  const html = layers.map((l1, i) => {
    const id = `card-comp-l1-${i}`;
    const l2Html = renderL2(l1.l2_variants, id);
    const heroName = l1.hero ? `<span class="comp-hero-badge">${HERO_ZH_COMP[l1.hero] || l1.hero}</span>` : '';
    return `<div class="comp-group" id="${id}">
      <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')">
        <span class="comp-rank">${medals[i] || i+1}</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <span style="font-size:11px;color:var(--text-secondary)">L1 体系</span>
            ${heroName}
          </div>
          <div class="comp-rep-cards">${chips(l1.core_cards)}</div>
        </div>
        <div class="comp-stats">
          <div>
            <div class="comp-rate" style="color:${rateColorComp(l1.rate)}">${(l1.rate*100).toFixed(1)}%</div>
            <div class="comp-count">评分${(l1.score*100).toFixed(0)} · ${l1.count}次</div>
          </div>
          <span class="comp-expand-icon">▼</span>
        </div>
      </div>
      <div class="comp-variants">${l2Html}</div>
    </div>`;
  }).join('');

  document.getElementById('comp-result').innerHTML = `
    <div class="comp-summary">
      <div class="comp-summary-card"><div class="comp-summary-label">当前范围</div><div class="comp-summary-value">${data.phase || '当前 phase'}</div></div>
      <div class="comp-summary-card"><div class="comp-summary-label">命中对局</div><div class="comp-summary-value">${data.total_runs || 0}</div></div>
      <div class="comp-summary-card"><div class="comp-summary-label">分析卡牌</div><div class="comp-summary-value">${data.card || '—'}</div></div>
    </div>
    <div class="comp-toolbar">
      <div class="comp-note">以下为包含「${data.card}」的相似核心阵容思路，完整配置可展开参考。</div>
      <div class="comp-sort-tabs">
        <button class="comp-sort-btn active" data-comp-sort="score">综合推荐</button>
        <button class="comp-sort-btn" data-comp-sort="appearance">出场率</button>
        <button class="comp-sort-btn" data-comp-sort="rate">胜率</button>
      </div>
    </div>
    <div id="comp-recommendations"></div>
    <div class="comp-system-toggle"><button class="comp-link-btn" onclick="document.getElementById('comp-system-layers').style.display=document.getElementById('comp-system-layers').style.display==='none'?'block':'none'">展开/收起体系层级分析</button></div>
    <div id="comp-system-layers" style="display:none;margin-top:12px">${html}</div>`;
  renderCompRecommendations(data);
}

function renderCompRecommendations(data) {
  const el = document.getElementById('comp-recommendations');
  if (!el) return;
  const items = (data.recommendations || []).slice();
  let mode = 'score';
  const render = () => {
    const sorted = items.sort((a,b) => mode === 'rate' ? (b.rate-a.rate || b.count-a.count) : mode === 'appearance' ? (b.global_appearance_rate-a.global_appearance_rate || b.count-a.count) : (b.score-a.score || b.count-a.count));
    el.innerHTML = sorted.length ? sorted.map((cfg, i) => {
      const anchor = (cfg.cards || []).map(c => c.cardId).includes(data.card_id);
      const cards = (cfg.cards || []).map(c => {
        const cls = c.cardId === data.card_id ? 'comp-card-chip has-img comp-anchor' : 'comp-card-chip has-img';
        const img = c.img ? '<img class="comp-card-img size-' + (c.size || 'Small') + '" src="' + c.img + '" alt="' + c.name_zh + '" loading="lazy" onerror="this.style.display=\'none\'">' : '';
        return '<span class="' + cls + '">' + img + c.name_zh + '</span>';
      }).join('');
      const coreCards = (cfg.core_cards || []).map(c => c.name_zh).join('、');
      const variantCards = (cfg.variant_cards || []).map(c => c.name_zh).join('、');
      const runUrl = cfg.run_url || (cfg.run_id ? `https://bazaardb.gg/run/tracker/${cfg.run_id}` : '');
      return `<div class="comp-idea-card"><div class="comp-idea-head"><div><div class="comp-idea-title">${i+1}. ${cfg.hero_zh || cfg.hero || ''} · 参考阵容</div><div class="comp-rep-cards">${cards}</div></div><div class="comp-metrics"><div class="comp-metric"><strong>${(cfg.global_appearance_rate*100).toFixed(1)}%</strong><span>出场率</span></div><div class="comp-metric"><strong style="color:${rateColorComp(cfg.rate)}">${(cfg.rate*100).toFixed(1)}%</strong><span>胜率</span></div></div></div><div class="comp-details"><div class="comp-note"><b>体系核心：</b>${coreCards || '暂无'}</div>${variantCards ? `<div class="comp-note"><b>该代表构筑的变体：</b>${variantCards}</div>` : ''}<div class="comp-note">${cfg.count} 次样本${cfg.sample_warning ? ' · 样本较少，仅供参考' : ''}</div><div class="comp-detail-actions">${cfg.screenshot ? `<button class="comp-link-btn" onclick="toggleScreenshotComp('recommend-${i}')">📷 查看截图</button><span id="recommend-${i}" style="display:none"><img src="${cfg.screenshot.startsWith('http')?cfg.screenshot:'https://usercontent.bzdb.network'+cfg.screenshot}" style="max-width:100%;margin-top:8px;border-radius:5px" loading="lazy"></span>` : ''}${runUrl ? `<a class="comp-link-btn" href="${runUrl}" target="_blank">查看原始 run →</a>` : ''}</div></div></div>`;
    }).join('') : '<div class="result-card"><div class="empty">当前 phase 暂无足够样本形成可参考阵容</div></div>';
  };
  document.querySelectorAll('[data-comp-sort]').forEach(btn => btn.onclick = () => { mode=btn.dataset.compSort; document.querySelectorAll('[data-comp-sort]').forEach(b=>b.classList.toggle('active',b===btn)); render(); });
  render();
}
