}

.fb-textarea {

.fb-card::before {

}

.fb-like-btn.liked {

/* 通用状态 - Loading / Empty / Error */
.loading {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.loading::before {
  content: '⚡';
  display: block;
  font-size: 32px;
  margin-bottom: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.runs-progress-wrap{padding:40px 20px;text-align:center;}
.runs-progress-bar-bg{width:100%;max-width:320px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin:12px auto 8px;overflow:hidden;}
.runs-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--neon-violet),var(--neon-cyan));border-radius:3px;transition:width 0.3s ease;animation:runs-progress-pulse 1.5s ease-in-out infinite;}
@keyframes runs-progress-pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.runs-progress-label{font-size:12px;color:var(--text-secondary);}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.empty::before {
  content: '🔍';
  display: block;
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.error-msg {
  background: rgba(var(--theme-coral-rgb, 255, 83, 106), 0.08);

  padding: 12px 16px;
  color: var(--neon-coral);
  font-size: 13px;
  margin-bottom: 16px;
  position: relative;
}

  content: '⚠';
  margin-right: 6px;
  font-size: 16px;
}

/* 链接样式 */
.run-link {
  font-size: 12px;
  color: var(--neon-cyan);
  text-decoration: none;
  white-space: nowrap;
  font-weight: 600;

}

.run-link:hover {
  color: var(--neon-teal);
  text-shadow: 0 0 8px rgba(var(--theme-cyan-rgb, 38, 217, 242), 0.5);
}

/* Footer */
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
footer {
  margin-top: auto;
  padding: 30px 20px;
  border-top: 1px solid rgba(var(--theme-violet-rgb, 138, 77, 255), 0.2);

  color: var(--text-secondary);
  font-size: 12px;

  z-index: 2;
}

footer a {
  color: var(--neon-cyan);
  text-decoration: none;
  margin: 0 15px;
  transition: color 0.2s;
}

footer a:hover {
  color: var(--neon-teal);
  text-shadow: 0 0 8px rgba(var(--theme-cyan-rgb, 38, 217, 242), 0.5);
}

/* 移动端适配 (< 768px) */
@media (max-width: 768px) {
  .navbar {
    height: auto;
    padding: 12px 16px;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }

  .logo {

  }

  .nav-tabs {

    overflow-y: hidden;

  }

    display: none;
  }

  .nav-tab {
    font-size: 13px;
    padding: 8px 14px;
    flex-shrink: 0;
  }

  .main {
    padding: 24px 12px;
  }

  .form-card {
    padding: 16px;
  }

  .form-row {
    flex-direction: column;

  }

  .form-group {
    width: 100%;
  }

    width: 100%;
    min-width: auto;
  }

  .btn {
    width: 100%;
    justify-content: center;
  }

  .winrate-card {
    padding: 24px 16px;
  }

  .winrate-big {
    font-size: 56px;
  }

  .winrate-bar-wrap {
    width: 100%;
    max-width: 260px;
  }

  .winrate-stats {
    gap: 24px;
  }

  .topcard-grid {
    grid-template-columns: 1fr;
  }

  .run-item {
    flex-wrap: wrap;
    gap: 8px;
  }

  .run-hero {
    order: -1;
  }

  .run-meta {
    width: 100%;
  }

  .win-badge {

  }

  .partner-item {
    flex-wrap: wrap;
    gap: 10px;
  }

  .partner-rank {
    width: 20px;
  }

  .partner-bar-wrap {
    width: 100%;

  }

  footer {
    margin-top: 40px;

  }
}

/* 职业榜单筛选控件 - 横向排列 */
.topcard-controls {

/* 意见反馈双列布局 */
.fb-layout {
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 24px;
}

.fb-form-card {
  background: var(--bg-surface);
  border: 1px solid rgba(var(--theme-coral-rgb, 255, 83, 106), 0.35);
  border-radius: 8px;
  padding: 20px;
  position: relative;
  box-shadow: inset 0 0 40px rgba(var(--theme-coral-rgb, 255, 83, 106), 0.04);

  top: 80px;

.fb-form-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;

  clip-path: polygon(100% 0, 0 0, 100% 100%);

.fb-success {

}

.fb-upload-area {

  width: 100%;
  height: 40px;

.fb-upload-hint {
  border: 1px dashed rgba(var(--theme-coral-rgb, 255, 83, 106), 0.3);

  color: var(--text-secondary);

.masonry {

    width: 100%;

/* ============================================

   ============================================ */

<script>
const HEROES = {瓦内莎:'Vanessa',杜利:'Dooley',马克:'Mak',皮格马利翁:'Pygmalien',斯黛尔:'Stelle',朱尔斯:'Jules',卡诺克:'Karnok',双龙:'The Dragons'};
let lastQuery = 0;
let activeRunsController = null;
let activeRunsRequestId = 0;
let selectedRunCards = [];
const RUN_ENCHANTMENTS = {Deadly:'致命',Fiery:'炽焰',Golden:'黄金',Heavy:'沉重',Icy:'寒冰',Obsidian:'黑曜石',Radiant:'辉耀',Restorative:'回复',Shielded:'护盾',Shiny:'闪亮',Toxic:'毒素',Turbo:'疾速',Mossy:'长青'};
let runCardSuggestions = [];
let runCardActiveIndex = -1;
let cardSearchTimer = null;
let cardSearchController = null;
let cardSearchRequestId = 0;

function escapeRunCardText(value) {
  return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showRunFileNotice() {
  if (location.protocol !== 'file:') return false;
  showError('runs-error', '当前是直接打开的本地文件，无法访问卡牌搜索和阵容查询接口。请通过 <a href="http://127.0.0.1:1027/runs" style="color:var(--neon-cyan)">本地 HTTP 预览</a> 打开本页。');
  return true;
}
function syncRunCards() {
  document.getElementById('runs-cards').value = selectedRunCards.map(card => card.name).join('+');
  document.getElementById('runs-card-tags').innerHTML = selectedRunCards.map((card, index) => {
    const options = '<option value="">不限附魔</option>' + Object.entries(RUN_ENCHANTMENTS).map(([value, label]) =>
      `<option value="${value}"${card.enchantment === value ? ' selected' : ''}>${label}</option>`).join('');
    return `<span class="runs-card-tag">${escapeRunCardText(card.name)}<select class="runs-enchantment-select" aria-label="${escapeRunCardText(card.name)}的附魔" onclick="event.stopPropagation()" onchange="setRunCardEnchantment(${index},this.value)">${options}</select><button type="button" aria-label="删除 ${escapeRunCardText(card.name)}" onclick="event.stopPropagation();removeRunCard(${index})">×</button></span>`;
  }).join('');
}
function addRunCard(name, enchantment = null, cardId = null, type = null) {
  name = String(name || '').trim();
  if (!name || selectedRunCards.some(card => card.name === name && card.enchantment === enchantment)) return;
  if (selectedRunCards.length >= 20) { showError('runs-error', '最多支持 20 个卡牌筛选条件'); return; }
  selectedRunCards.push({name, enchantment, ...(cardId ? {cardId} : {}), ...(type ? {type} : {})});
  syncRunCards();
}
function setRunCardEnchantment(index, value) {
  const enchantment = value || null;
  if (enchantment && !Object.hasOwn(RUN_ENCHANTMENTS, enchantment)) return;
  const card = selectedRunCards[index];
  if (!card) return;
  if (selectedRunCards.some((other, i) => i !== index && other.name === card.name && other.enchantment === enchantment)) {
    showError('runs-error', '已存在相同的卡牌和附魔条件');
  } else {
    card.enchantment = enchantment;
    showError('runs-error', '');
  }
  syncRunCards();
  document.querySelectorAll('.runs-enchantment-select')[index]?.focus();
}
function removeRunCard(index) {
  selectedRunCards.splice(index, 1);
  syncRunCards();
  document.getElementById('runs-card-search').focus();
}
function readLegacyCardsParam(search) {
  const raw = String(search || '').replace(/^\?/, '').split('&').find(part => part.split('=')[0] === 'cards');
  if (!raw) return new URLSearchParams(search).get('cards') || '';
  try { return decodeURIComponent(raw.replace(/\+/g, '%2B').slice(raw.indexOf('=') + 1)); }
  catch (_) { return new URLSearchParams(search).get('cards') || ''; }
}
function restoreRunCards(value) {
  selectedRunCards = [];
  String(value || '').split('+').map(v => v.trim()).filter(Boolean).forEach(name => addRunCard(name));
  syncRunCards();
}
function restoreRunCardFilters(value) {
  const filters = JSON.parse(value);
  if (!Array.isArray(filters) || filters.length > 20 || filters.some(card =>
    !card || typeof card.name !== 'string' || !card.name.trim() || card.name.length > 160 ||
    (card.enchantment != null && (typeof card.enchantment !== 'string' || !Object.hasOwn(RUN_ENCHANTMENTS, card.enchantment))))) {
    throw new Error('无效的卡牌附魔筛选链接');
  }
  selectedRunCards = [];
  filters.forEach(card => addRunCard(card.name, card.enchantment ?? null));
  syncRunCards();
}
function closeRunCardSuggestions() {
  clearTimeout(cardSearchTimer);
  cardSearchRequestId += 1;
  if (cardSearchController) {
    cardSearchController.abort();
    cardSearchController = null;
  }
  runCardSuggestions = [];
  runCardActiveIndex = -1;
  const menu = document.getElementById('runs-card-suggestions');
  menu.classList.remove('open');
  menu.innerHTML = '';
}
function renderRunCardSuggestions() {
  const menu = document.getElementById('runs-card-suggestions');
  if (!runCardSuggestions.length) {
    menu.innerHTML = '<div class="runs-card-empty">没有找到相关卡牌</div>';
  } else {
    menu.innerHTML = runCardSuggestions.map((card, index) => {
      const image = card.img ? `<img src="${escapeRunCardText(card.img)}" alt="" loading="lazy">` : '';
      const english = card.en && card.en !== card.zh ? `<small>${escapeRunCardText(card.en)}</small>` : '';
      return `<button type="button" class="runs-card-option${index === runCardActiveIndex ? ' active' : ''}" ${window.BazaarCardPreview?.attrs(card,true)||''} role="option" onmousedown="event.preventDefault()" onclick="selectRunCardSuggestion(${index})">${image}<span class="runs-card-option-text"><strong>${escapeRunCardText(card.zh)}</strong>${english}</span></button>`;
    }).join('');
  }
  menu.classList.add('open');
  menu.querySelector('.active')?.scrollIntoView({block:'nearest'});
}
function selectRunCardSuggestion(index) {
  const card = runCardSuggestions[index];
  if (!card) return;
  addRunCard(card.zh || card.en, null, card.cardId, card.type);
  document.getElementById('runs-card-search').value = '';
  closeRunCardSuggestions();
  document.getElementById('runs-card-search').focus();
}
async function searchRunCards(query) {
  if (showRunFileNotice()) return;
  if (cardSearchController) cardSearchController.abort();
  const requestId = ++cardSearchRequestId;
  cardSearchController = new AbortController();
  const input = document.getElementById('runs-card-search');
  try {
    const typeFilter = _viewMode === 'comp' ? '&type=item' : '';
    const res = await fetch('/api/card_search?q=' + encodeURIComponent(query) + typeFilter, {signal:cardSearchController.signal});
    const rows = await res.json();
    if (requestId !== cardSearchRequestId || input.value.trim() !== query) return;
    runCardSuggestions = (Array.isArray(rows) ? rows : []).filter(card => !selectedRunCards.some(selected => selected.name === (card.zh || card.en) && selected.enchantment === null));
    runCardActiveIndex = runCardSuggestions.length ? 0 : -1;
    renderRunCardSuggestions();
  } catch (error) {
    if (error.name !== 'AbortError') closeRunCardSuggestions();
  }
}
function scheduleRunCardSearch() {
  clearTimeout(cardSearchTimer);
  const input = document.getElementById('runs-card-search');
  const query = input.value.trim();
  if (!query) { closeRunCardSuggestions(); return; }
  cardSearchTimer = setTimeout(() => searchRunCards(query), 180);
}
function handleRunCardKeydown(event) {
  if (event.key === 'ArrowDown' && runCardSuggestions.length) {
    event.preventDefault(); runCardActiveIndex = (runCardActiveIndex + 1) % runCardSuggestions.length; renderRunCardSuggestions();
  } else if (event.key === 'ArrowUp' && runCardSuggestions.length) {
    event.preventDefault(); runCardActiveIndex = (runCardActiveIndex - 1 + runCardSuggestions.length) % runCardSuggestions.length; renderRunCardSuggestions();
  } else if (event.key === 'Enter' && runCardSuggestions.length && runCardActiveIndex >= 0) {
    event.preventDefault(); selectRunCardSuggestion(runCardActiveIndex);
  } else if (event.key === 'Escape') {
    closeRunCardSuggestions();
  } else if (event.key === 'Backspace' && !event.currentTarget.value && selectedRunCards.length) {
    removeRunCard(selectedRunCards.length - 1);
  }
}
function initRunCardPicker() {
  const input = document.getElementById('runs-card-search');
  input.addEventListener('input', scheduleRunCardSearch);
  input.addEventListener('keydown', handleRunCardKeydown);
  document.addEventListener('click', event => {
    if (!document.getElementById('runs-card-picker').contains(event.target)) closeRunCardSuggestions();
  });
}
// 初始化视图状态
document.addEventListener('DOMContentLoaded', () => {
  initRunCardPicker();
  if (showRunFileNotice()) return;
  document.getElementById('comp-result').style.display = 'none';
  document.getElementById('comp-result').innerHTML = '<div class="result-card"><div class="empty">输入卡牌名称后点击查询，即可查看阵容分析</div></div>';
  const params = new URLSearchParams(location.search);
  if (params.has('run')) {
    window.BazaarRuns.loadRun(params.get('run'));
    return;
  }
  const hero = params.get('hero');
  const cards = readLegacyCardsParam(location.search);
  const rank = params.get('rank');
  if (hero) document.getElementById('runs-hero').value = hero;
  try {
    if (params.has('card_filters')) restoreRunCardFilters(params.get('card_filters'));
    else if (cards) restoreRunCards(cards);
  } catch (_) {
    showError('runs-error', '无效的卡牌附魔筛选链接，请重新选择卡牌和附魔');
    return;
  }
  if (params.get('days')) document.getElementById('runs-days').value = params.get('days');
  if (rank && document.querySelector(`#runs-rank option[value="${CSS.escape(rank)}"]`)) {
    document.getElementById('runs-rank').value = rank;
  }
  if (params.get('mode') === 'comp') setViewMode('comp');
  if (params.get('auto') === '1') {
    const page = Math.max(1, parseInt(params.get('page'), 10) || 1);
    setTimeout(() => queryRuns(page, 'auto'), 0);
  }
});

function switchTab(tab) {
  if (tab === "topcard" && !window._topcardLoaded) { setTimeout(loadTopcard, 0); }
  if (tab === "feedback" && !_fbLoaded) { setTimeout(() => loadFeedback(true), 0); }
  trackPV(tab);
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    t.classList.toggle('active', ['runs','winrate','partner','topcard','feedback'][i]===tab);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

function checkRate() {
  const now = Date.now();
  if (now - lastQuery < 3000) {
    const wait = ((3000-(now-lastQuery))/1000).toFixed(1);
    return `请等待 ${wait} 秒后再查询`;
  }
  lastQuery = now;
  return null;
}

function showError(id, msg) {
  document.getElementById(id).innerHTML = msg ? `<div class="error-msg">${msg}</div>` : '';
}

function winrateColor(r) {
  if (r >= 0.7) return 'var(--theme-teal, #10b981)';
  if (r >= 0.5) return 'var(--theme-gold, #f59e0b)';
  return 'var(--theme-coral, #ef4444)';
}

async function queryRuns(page, origin = 'user') {
  if (showRunFileNotice()) return;
  window.BazaarRuns.cancelDetail();
  if (activeRunsController) {
    activeRunsController.abort();
    activeRunsController = null;
    activeRunsRequestId += 1;
  }
  const err = checkRate();
  if (err) { showError('runs-error', err); return; }
  showError('runs-error', '');
  const hero = document.getElementById('runs-hero').value;
  const cards = document.getElementById('runs-cards').value.trim();
  const cardFilters = selectedRunCards.map(card => ({name:card.name, enchantment:card.enchantment}));
  const wins = '10';
  const days = document.getElementById('runs-days').value;
  const rank = document.getElementById('runs-rank').value;
  // 阵容分析模式
  if (_viewMode === 'comp') {
    if (activeRunsController) {
      activeRunsController.abort();
      activeRunsController = null;
      activeRunsRequestId += 1;
    }
    document.getElementById('runs-result').style.display = 'none';
    document.getElementById('comp-result').style.display = '';
    await queryComp(origin);
    return;
  }
  const requestId = ++activeRunsRequestId;
  if (activeRunsController) activeRunsController.abort();
  activeRunsController = new AbortController();
  const controller = activeRunsController;
  document.getElementById('runs-result').style.display = '';
  document.getElementById('comp-result').style.display = 'none';
  const _runsEl = document.getElementById('runs-result');
  _runsEl.innerHTML = `<div class="runs-progress-wrap">
    <div class="runs-progress-label">正在查询阵容数据，请稍候...</div>
    <div class="runs-progress-bar-bg"><div class="runs-progress-bar" id="runs-pbar"></div></div>
    <div class="runs-progress-label" id="runs-pct">0%</div>
  </div>`;
  const progressStartedAt = performance.now();
  // 让浏览器先完成一次绘制，避免快速接口返回时进度条只写入 DOM、用户完全看不到。
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  let _runsPct = 0;
  const _runsTimer = setInterval(() => {
    if (_runsPct < 80) {
      _runsPct += _runsPct < 30 ? 3 : _runsPct < 60 ? 1.5 : 0.5;
      const bar = document.getElementById('runs-pbar');
      const lbl = document.getElementById('runs-pct');
      if (bar) bar.style.width = _runsPct.toFixed(0) + '%';
      if (lbl) lbl.textContent = _runsPct.toFixed(0) + '%';
    }
  }, 200);
  const params = new URLSearchParams({min_wins: wins, page, rank});
  if (hero) params.set('hero', hero);
  if (cardFilters.length) params.set('card_filters', JSON.stringify(cardFilters));
  if (days) params.set('days', days);
  const timeoutId = setTimeout(() => controller.abort(new DOMException('查询超时', 'TimeoutError')), 30000);
  try {
    const res = await (window.BazaarSearch ? BazaarSearch.query('runs', '/api/runs?' + params, {signal:controller.signal}, origin === 'user' && Number(page) === 1) : fetch('/api/runs?' + params, {signal:controller.signal}));
    if (!res.ok) {
      let message = `HTTP ${res.status}`;
      try { const body = await res.json(); message = body.error || message; } catch (_) {}
      throw new Error(message);
    }
    const data = await res.json();
    if (requestId !== activeRunsRequestId) return;
    const remaining = Math.max(0, 600 - (performance.now() - progressStartedAt));
    if (remaining > 0) await new Promise(resolve => setTimeout(resolve, remaining));
    if (requestId !== activeRunsRequestId) return;
    const bar = document.getElementById('runs-pbar');
    const lbl = document.getElementById('runs-pct');
    if (bar) bar.style.width = '100%';
    if (lbl) lbl.textContent = '100%';
    await new Promise(resolve => setTimeout(resolve, 300));
    if (requestId !== activeRunsRequestId) return;
    if (data.error) { showError('runs-error', data.error); _runsEl.innerHTML=''; return; }
    const resultPage = data.page || page;
    const shareParams = new URLSearchParams(params);
    shareParams.set('page', resultPage);
    shareParams.set('auto', '1');
    history.replaceState(null, '', location.pathname + '?' + shareParams);
    renderRuns(data, resultPage, {hero, cards, wins, days, rank});
  } catch(e) {
    if (requestId !== activeRunsRequestId) return;
    const message = ['AbortError', 'TimeoutError'].includes(e.name)
      ? '查询超时，请缩小筛选范围后重试'
      : '请求失败: ' + e.message;
    showError('runs-error', message);
    _runsEl.innerHTML='';
  } finally {
    clearTimeout(timeoutId);
    clearInterval(_runsTimer);
    if (requestId === activeRunsRequestId) activeRunsController = null;
  }
}

function renderRuns(data, page, params) {
  const {runs, total, pages} = data;
  if (!runs || runs.length === 0) {
    document.getElementById('runs-result').innerHTML = '<div class="result-card"><div class="empty">未找到符合条件的阵容</div></div>';
    return;
  }
  const items = window.BazaarRuns.renderRows(runs);

  let pagination = '';
  if (pages > 1) {
    const btns = [];
    const startPage = Math.max(1, Math.min(page - 4, pages - 9));
    if (startPage > 1) btns.push('<button class="page-btn" onclick="queryRuns(1, &quot;page&quot;)">首页</button>');
    for (let i = startPage; i <= Math.min(pages, startPage + 9); i++) {
      btns.push(`<button class="page-btn${i===page?' active':''}" onclick="queryRuns(${i}, &quot;page&quot;)">${i}</button>`);
    }
    if (startPage + 9 < pages) btns.push(`<button class="page-btn" onclick="queryRuns(${pages}, &quot;page&quot;)">末页</button>`);
    pagination = `<div class="pagination">${btns.join('')}</div>`;
  }

  document.getElementById('runs-result').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <span>${Number(data.min_wins ?? params.wins) === 10 ? '10 胜阵容列表' : '阵容列表'}</span>
        <span class="total">共 ${total} 条结果（第 ${page}/${pages} 页）${params.day ? ` · 打到 Day ${params.day}` : ''}</span>
      </div>
      ${window.BazaarRuns.querySummary(data, params)}
      ${items}
      ${pagination}
    </div>`;
}

async function queryWinrate() {
  const err = checkRate();
  if (err) { showError('wr-error', err); return; }
  showError('wr-error', '');
  const cards = document.getElementById('wr-cards').value.trim();
  const hero = document.getElementById('wr-hero').value;
  const days = document.getElementById('wr-days').value;
  if (!cards) { showError('wr-error', '请输入至少一张卡牌'); return; }
  document.getElementById('wr-result').innerHTML = '<div class="loading">查询中...</div>';
  const params = new URLSearchParams({cards});
  if (hero) params.set('hero', hero);
  if (days) params.set('days', days);
  try {
    const res = await fetch('/api/winrate?' + params);
    const data = await res.json();
    if (data.error) { showError('wr-error', data.error); document.getElementById('wr-result').innerHTML=''; return; }
    renderWinrate(data);
  } catch(e) { showError('wr-error', '请求失败: '+e.message); document.getElementById('wr-result').innerHTML=''; }
}

function renderWinrate(data) {
  const {card_names, not_found, total, ten_win, rate} = data;
  if (total === 0) {
    document.getElementById('wr-result').innerHTML = '<div class="result-card"><div class="empty">暂无数据</div></div>';
    return;
  }
  const color = winrateColor(rate);
  const pct = (rate*100).toFixed(1);
  const title = card_names.join(' + ') || '查询卡牌';
  let notFoundHtml = not_found && not_found.length ? `<div style="color:var(--theme-coral, #f87171);font-size:12px;margin-top:12px">未识别: ${not_found.join(', ')}</div>` : '';
  document.getElementById('wr-result').innerHTML = `
    <div class="winrate-card">
      <div class="winrate-title">${title} 的10胜率</div>
      <div class="winrate-big" style="color:${color}">${pct}%</div>
      <div class="winrate-bar-wrap"><div class="winrate-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="winrate-stats">
        <div class="winrate-stat"><div class="num">${ten_win}</div><div class="lbl">10胜局数</div></div>
        <div class="winrate-stat"><div class="num">${total}</div><div class="lbl">含该卡总局数</div></div>
      </div>
      ${notFoundHtml}
    </div>`;
}

async function queryPartner() {
  const err = checkRate();
  if (err) { showError('pt-error', err); return; }
  showError('pt-error', '');
  const card = document.getElementById('pt-card').value.trim();
  const days = document.getElementById('pt-days').value;
  if (!card) { showError('pt-error', '请输入卡牌名称'); return; }
  document.getElementById('pt-result').innerHTML = '<div class="loading">查询中...</div>';
  const params = new URLSearchParams({card});
  if (days) params.set('days', days);
  try {
    const res = await fetch('/api/partner?' + params);
    const data = await res.json();
    if (data.error) { showError('pt-error', data.error); document.getElementById('pt-result').innerHTML=''; return; }
    renderPartner(data);
  } catch(e) { showError('pt-error', '请求失败: '+e.message); document.getElementById('pt-result').innerHTML=''; }

function renderPartner(data) {
  const {card_name, by_winrate, by_appear, target_total} = data;
  if (!by_winrate.length && !by_appear.length) {
    document.getElementById('pt-result').innerHTML = '<div class="result-card"><div class="empty">暂无满足条件的搭档数据（需至少50次共现）</div></div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];

  function renderList(items, rateKey, rateLabel, barColor) {
    return items.map((p,i) => {
      const rate = p[rateKey];
      const pct = (rate*100).toFixed(1);
      const sub = rateKey === 'rate'
        ? `${p.ten_win}/${p.total} 局`
        : `${p.total}/${target_total} 局`;
      return `<div class="partner-item">
        <span class="partner-rank">${medals[i]}</span>
        <div style="flex:1">
          <div class="partner-name">${p.name}</div>
          <div class="partner-sub">${sub}</div>
        </div>
        <div style="text-align:right">
          <div class="partner-rate" style="color:${winrateColor(rate)}">${pct}%</div>
          <div class="partner-sub">${rateLabel}</div>
        </div>
        <div class="partner-bar-wrap"><div class="partner-bar" style="width:${Math.min(pct,100)}%;background:${winrateColor(rate)}"></div></div>
      </div>`;
    }).join('');
  }

  document.getElementById('pt-result').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <span>${card_name} 最佳搭档</span>
        <span class="total">含该卡共 ${target_total} 局</span>
      </div>
      <div class="partner-section-title">📈 胜率榜 TOP3</div>
      ${renderList(by_winrate, 'rate', '10胜率', '#10b981')}
      <div class="partner-section-title" style="margin-top:4px">🔗 组合率榜 TOP3</div>
      ${renderList(by_appear, 'appear_rate', '组合率', '#3b82f6')}
    </div>`;
}

// Enter 键触发查询
document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  if (e.target.closest('button, a, select')) return;
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.panel.active').id;
  if (active === 'panel-runs') queryRuns(1);
  else if (active === 'panel-winrate') queryWinrate();
  else if (active === 'panel-partner') queryPartner();
});

function loadSuggestions() {
  fetch('/api/suggestions')
    .then(r => r.json())
    .then(data => {
      const heroes = data.heroes || [];
      const cards = data.cards || [];
      if (!heroes.length && !cards.length) return;
      document.getElementById('suggest-area').style.display = 'block';
      document.getElementById('suggest-heroes').innerHTML = heroes.map(h =>
        `<span class="chip" onclick="applySuggestion('hero','${h.name}')">${h.name}<span class="cnt">${h.count}</span></span>`
      ).join('');
      document.getElementById('suggest-cards').innerHTML = cards.map(c =>
        `<span class="chip" onclick="applySuggestion('card','${c.name}')">${c.name}<span class="cnt">${c.count}</span></span>`
      ).join('');
    }).catch(() => {});
}

function applySuggestion(type, val) {
  const activeTab = document.querySelector('.nav-tab.active').textContent.trim();
  const isRuns = activeTab.includes('阵容');
  const isWinrate = activeTab.includes('胜率');
  if (type === 'hero') {
    const selId = isRuns ? 'runs-hero' : 'winrate-hero';
    const sel = document.getElementById(selId);
    if (sel) Array.from(sel.options).forEach(o => { if (o.text === val) sel.value = o.value; });
  } else {
    if (isRuns) addRunCard(val);
    else {
      const inpId = isWinrate ? 'winrate-cards' : 'partner-card';
      const inp = document.getElementById(inpId);
      if (inp) inp.value = val;
    }
  }
}

async function loadTopcard() {
  const n = document.getElementById('topcard-n').value;
  const days = document.getElementById('topcard-days').value;
  const el = document.getElementById('topcard-result');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const results = await Promise.all(TC_HEROES.map(h => {
      let url = '/api/topcard?hero=' + encodeURIComponent(h.key) + '&top=' + n;
      if (days) url += '&days=' + days;
      return fetch(url).then(r => r.json()).then(data => ({hero: h, data}));
    }));
    el.innerHTML = '<div class="topcard-grid">' + results.map(({hero, data}) => {
      const top = data.top || [];
      const rows = top.map((item, i) => {
        const rate = item.rate || 0;
        const barW = Math.min(Math.round(rate * 100), 100);
        const color = tcRateColor(rate);
        const nameEn = item.name_zh !== item.name_en ? item.name_en : '';
        return '<div class="topcard-item">' +
          '<div class="topcard-rank">' + (RANK_ICONS[i] || (i+1)) + '</div>' +
          '<div class="topcard-name">' +
            '<div class="topcard-name-zh">' + item.name_zh + '</div>' +
            (nameEn ? '<div class="topcard-name-en">' + nameEn + '</div>' : '') +
          '</div>' +
          '<div class="topcard-rate-wrap">' +
            '<div class="topcard-rate" style="color:' + color + '">' + (rate*100).toFixed(1) + '%</div>' +
            '<div class="topcard-sub">' + item.ten_win + '胜/' + item.total + '局</div>' +
            '<div class="topcard-bar-wrap"><div class="topcard-bar" style="width:' + barW + '%;background:' + color + '"></div></div>' +
          '</div>' +
        '</div>';
      }).join('');
      const empty = top.length === 0 ? '<div class="empty">暂无数据</div>' : '';
      return '<div class="topcard-hero-card">' +
        '<div class="topcard-hero-header">' +
          '<div class="topcard-hero-name">' + hero.zh + '</div>' +
          '<div class="topcard-hero-runs">' + (data.total_runs || 0) + ' 局</div>' +
        '</div>' +
        rows + empty +
      '</div>';
    }).join('') + '</div>';
    window._topcardLoaded = true;
  } catch(e) {
    el.innerHTML = '<div class="error-msg">加载失败: ' + e.message + '</div>';
  }
}

let _fbPage = 1, _fbLoaded = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function maskContact(s) {
  if (!s) return '';
  s = s.trim();
  if (s.includes('@')) {
    const at = s.indexOf('@');
    const local = s.slice(0, at);
    const domain = s.slice(at);
    if (local.length <= 2) return local[0] + '***' + domain;
    return local[0] + '***' + local.slice(-1) + domain;
  }
  if (/^\d+$/.test(s)) {
    if (s.length <= 4) return s[0] + '***';
    return s.slice(0, 2) + '***' + s.slice(-2);
  }
  if (s.length <= 3) return s[0] + '***';
  return s.slice(0, 2) + '***' + s.slice(-1);
}

function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('fb-preview');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.querySelector('.fb-upload-hint').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function submitFeedback() {
  const content = document.getElementById('fb-content').value.trim();
  if (!content) { alert('请输入内容'); return; }
  const fd = new FormData();
  fd.append('content', content);
  const contact = document.getElementById('fb-contact').value.trim();
  if (contact) fd.append('contact', contact);
  const fileInput = document.getElementById('fb-img-input');
  if (fileInput.files[0]) fd.append('image', fileInput.files[0]);
  const btn = document.querySelector('.fb-submit-btn');
  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const resp = await fetch('/api/feedback', {method:'POST', body:fd});
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.error || '提交失败'); }
    document.getElementById('fb-success').style.display = 'block';
    setTimeout(() => document.getElementById('fb-success').style.display = 'none', 3000);
    document.getElementById('fb-content').value = '';
    document.getElementById('fb-contact').value = '';
    document.getElementById('fb-preview').style.display = 'none';
    document.querySelector('.fb-upload-hint').style.display = '';
    fileInput.value = '';
    _fbPage = 1; await loadFeedback(true);
  } catch(e) { alert(e.message); }
  finally { btn.disabled = false; btn.textContent = '提交反馈'; }
}

async function loadFeedback(reset) {
  if (reset) _fbPage = 1;
  try {
    const resp = await fetch('/api/feedback?page=' + _fbPage);
    const data = await resp.json();
    const list = document.getElementById('fb-list');
    if (reset) list.innerHTML = '';
    if (!data.items || data.items.length === 0) {
      if (reset) list.innerHTML = '<div class="fb-empty">还没有反馈，快来抢沙发吧！</div>';
      document.getElementById('fb-loadmore').style.display = 'none';
      return;
    }
    data.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'fb-card'; card.dataset.id = item.id;
      const imgHtml = item.image_path ? '<img class="fb-card-img" src="' + item.image_path + '" loading="lazy">' : '';
      const contactHtml = item.contact ? '<div class="fb-card-contact">📬 ' + maskContact(escapeHtml(item.contact)) + '</div>' : '';
      const time = new Date(item.created_at + (item.created_at.includes('+') ? '' : ' UTC')).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      card.innerHTML = imgHtml +
        '<div class="fb-card-body">' +
          '<div class="fb-card-text">' + escapeHtml(item.content) + '</div>' +
          contactHtml +
          '<div class="fb-card-footer">' +
            '<span class="fb-card-time">' + time + '</span>' +
            '<button class="fb-like-btn" onclick="likeFeedback(' + item.id + ',this)">❤️ <span>' + item.likes + '</span></button>' +
            '<button class="fb-comment-btn" onclick="toggleComments(' + item.id + ')">💬 评论</button>' +
          '</div>' +
        '</div>' +
        '<div class="fb-comments-area" id="comments-' + item.id + '"></div>';
      list.appendChild(card);
    });
    _fbPage++;
    document.getElementById('fb-loadmore').style.display = (data.page < data.pages) ? 'block' : 'none';
    _fbLoaded = true;
  } catch(e) { console.error(e); }
}

async function likeFeedback(id, btn) {
  if (btn.classList.contains('liked')) return;
  try {
    const resp = await fetch('/api/feedback/' + id + '/like', {method:'POST'});
    const data = await resp.json();
    btn.querySelector('span').textContent = data.likes;
    btn.classList.add('liked');
  } catch(e) {}
}

async function toggleComments(id) {
  const area = document.getElementById('comments-' + id);
  if (area.style.display === 'block') { area.style.display = 'none'; return; }
  area.style.display = 'block';
  if (area.dataset.loaded) return;
  try {
    const resp = await fetch('/api/feedback/' + id + '/comments');
    const comments = await resp.json();
    area.innerHTML =
      '<div id="cmtlist-' + id + '"></div>' +
      '<div class="fb-comment-form">' +
        '<input class="fb-comment-input" placeholder="说点什么..." id="cmtinput-' + id + '" ' +
        'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postComment(' + id + ',null)}">' +
        '<button class="fb-comment-submit" onclick="postComment(' + id + ',null)">发送</button>' +
      '</div>';
    renderComments(id, comments, null, document.getElementById('cmtlist-' + id));
    area.dataset.loaded = 'true';
  } catch(e) {}
}

function renderComments(fbId, allComments, parentId, container) {
  const children = allComments.filter(c => c.parent_id === parentId);
  children.forEach(c => {
    const time = new Date(c.created_at + (c.created_at.includes('+') ? '' : ' UTC')).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const div = document.createElement('div');
    div.className = 'fb-comment-item'; div.id = 'cmt-' + c.id;
    div.innerHTML =
      '<div class="fb-comment-content">' + escapeHtml(c.content) + '</div>' +
      '<div class="fb-comment-meta">' +
        '<span>' + time + '</span>' +
        '<button class="fb-reply-btn" onclick="startReply(' + fbId + ',' + c.id + ')">回复</button>' +
      '</div>' +
      '<div class="fb-comment-children" id="children-' + c.id + '"></div>';
    container.appendChild(div);
    renderComments(fbId, allComments, c.id, document.getElementById('children-' + c.id));
  });
}

function startReply(fbId, parentId) {
  const existing = document.getElementById('reply-form-' + parentId);
  if (existing) { existing.remove(); return; }
  const cmt = document.getElementById('cmt-' + parentId);
  if (!cmt) return;
  const form = document.createElement('div');
  form.id = 'reply-form-' + parentId;
  form.className = 'fb-comment-form';
  form.style.marginTop = '6px';
  form.innerHTML =
    '<input class="fb-comment-input" placeholder="回复..." id="replyinput-' + parentId + '" ' +
    'onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();postComment(' + fbId + ',' + parentId + ')}">' +
    '<button class="fb-comment-submit" onclick="postComment(' + fbId + ',' + parentId + ')">发送</button>';
  cmt.appendChild(form);
  document.getElementById('replyinput-' + parentId).focus();
}

async function postComment(fbId, parentId) {
  const inputId = parentId ? 'replyinput-' + parentId : 'cmtinput-' + fbId;
  const input = document.getElementById(inputId);
  if (!input) return;
  const content = input.value.trim();
  if (!content) return;
  try {
    const resp = await fetch('/api/feedback/' + fbId + '/comments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content, parent_id: parentId || null})
    });
    if (!resp.ok) throw new Error('发送失败');
    const cmt = await resp.json();
    input.value = '';
    if (parentId) {
      const form = document.getElementById('reply-form-' + parentId);
      if (form) form.remove();
      const childrenEl = document.getElementById('children-' + parentId);
      if (childrenEl) renderComments(fbId, [cmt], parentId, childrenEl);
    } else {
      const list = document.getElementById('cmtlist-' + fbId);
      if (list) renderComments(fbId, [cmt], null, list);
    }
  } catch(e) { alert(e.message); }
}

function loadMoreFeedback() { loadFeedback(false); }


// ── 匿名 fingerprint ──
function getFingerprint() {
  let fp = localStorage.getItem('_bz_fp');
  if (!fp) {
    fp = 'fp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('_bz_fp', fp);
  }
  return fp;
}

// 全局覆盖 fetch，自动带上 fingerprint
const _origFetch = window.fetch;
window.fetch = function(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (typeof opts.headers === 'object' && !(opts.headers instanceof Headers)) {
    opts.headers['X-Fingerprint'] = getFingerprint();
  }
  return _origFetch(url, opts);
};

// Tab PV 上报
function trackPV(tab) {
  fetch('/api/track/pv', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({tab})
  }).catch(() => {});
}

// 首次进入上报
window.addEventListener('DOMContentLoaded', () => {
  trackPV('runs');
});


// ===== 阵容分析视图 =====
let _viewMode = 'list';
function setViewMode(mode) {
  if (!['list','comp'].includes(mode)) return;
  window.BazaarComp?.cancel();
  if (mode === 'comp' && _viewMode !== 'comp') window.BazaarComp?.track('view');
  _viewMode = mode;
  closeRunCardSuggestions();
  document.querySelectorAll('.view-toggle-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i === 0 && mode === 'comp') || (i === 1 && mode === 'list'));
  });
  document.getElementById('runs-result').style.display = mode === 'list' ? '' : 'none';
  document.getElementById('comp-result').style.display = mode === 'comp' ? '' : 'none';
  document.getElementById('runs-card-search').placeholder = mode === 'comp' ? '选择 1–5 张物品，多张需同时包含' : '输入部分卡名后选择';
  document.getElementById('runs-card-label').textContent = mode === 'comp' ? '物品（最多 5 张）' : '卡牌（可添加多张）';
  document.getElementById('runs-card-help').textContent = mode === 'comp' ? '选择已有物品查搭配；技能作为结果展示，附魔筛选仅支持阵容列表' : '先从联想列表选择卡牌，再点“不限附魔”选择附魔；多张卡需同时满足';
}
function queryComp(origin = 'user') {
  return window.BazaarComp.query(origin);
}
