<style>
/* ============================================
   霓虹幻想风格 - Neon Fantasy Data Platform
   ============================================ */

/* CSS 变量 - 色彩系统 */
:root {
  /* 主色 */
  --bg-deep: #090A2A;
  --bg-surface: #171047;
  --neon-magenta: #F438B8;
  --neon-cyan: #26D9F2;
  --neon-violet: #8A4DFF;
  --neon-teal: #36E3C1;
  --neon-coral: #FF536A;
  --neon-gold: #F5C76A;
  --text-primary: #F5F4FF;
  --text-secondary: #B5B3D7;

  /* 功能色 */
  --border-dim: rgba(138, 77, 255, 0.15);
  --border-bright: rgba(38, 217, 242, 0.4);
  --glow-magenta: 0 0 20px rgba(244, 56, 184, 0.5);
  --glow-cyan: 0 0 20px rgba(38, 217, 242, 0.5);
  --glow-violet: 0 0 16px rgba(138, 77, 255, 0.4);

  /* 胜率渐变 */
  --win-high: #36E3C1;
  --win-mid: #F5C76A;
  --win-low: #FF536A;
}

/* 全局重置 */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Body - 深靛蓝背景 + 细网格纹理 */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  background-image:
    linear-gradient(rgba(138, 77, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(138, 77, 255, 0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  position: relative;
  text-decoration: none;
}

/* 全局扫描线效果（极低透明度，不影响阅读）*/
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(38, 217, 242, 0.02) 2px,
    rgba(38, 217, 242, 0.02) 4px
  );
  pointer-events: none;
  z-index: 1;
}

/* ============================================
   导航栏 - 霓虹边框 + 品牌色
   ============================================ */
.navbar {
  background: var(--bg-surface);
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta)) 1;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  height: 64px;
  gap: 32px;
  box-shadow: 0 4px 24px rgba(244, 56, 184, 0.15);
}

.logo {
  font-size: 20px;
  font-weight: 800;
  color: var(--neon-magenta);
  letter-spacing: 0.05em;
  white-space: nowrap;
  text-shadow: var(--glow-magenta);
  position: relative;
  text-decoration: none;
}

.logo::before {
  content: '⚡';
  margin-right: 6px;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
}

.nav-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.nav-tab {
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
  border: 1px solid transparent;
  background: transparent;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  text-decoration: none;
  display: inline-block;
  font-family: inherit;
}

.nav-tab:hover {
  color: var(--text-primary);
  border-color: var(--border-bright);
  background: rgba(38, 217, 242, 0.08);
}

.nav-tab.active {
  color: var(--text-primary);
  background: linear-gradient(135deg, rgba(244, 56, 184, 0.15), rgba(38, 217, 242, 0.15));
  border-color: var(--neon-magenta);
  box-shadow: var(--glow-magenta);
}

.nav-tab.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
}

/* 主容器 */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px;
  position: relative;
  z-index: 2;
}

.panel {
  display: none;
}

.panel.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   表单组件 - 输入框、按钮、下拉
   ============================================ */

/* 筛选卡片 - 品红主边框 + 青色角标 */
.form-card {
  background: var(--bg-surface);
  border: 1px solid rgba(244, 56, 184, 0.35);
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 24px;
  position: relative;
  box-shadow: inset 0 0 40px rgba(244, 56, 184, 0.04);
}

/* 青色角标 */
.form-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-cyan);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
  border-radius: 0 8px 0 0;
}

.form-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-magenta);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  background: var(--neon-cyan);
  border-radius: 2px;
  box-shadow: var(--glow-cyan);
}

.form-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-group label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

/* 输入框 / 下拉框 */
input, select {
  background: rgba(9, 10, 42, 0.8);
  border: 1px solid rgba(138, 77, 255, 0.3);
  border-radius: 6px;
  padding: 9px 14px;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: all 0.2s;
  min-width: 140px;
  font-family: inherit;
}

input:hover, select:hover {
  border-color: rgba(38, 217, 242, 0.5);
}

input:focus, select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 2px rgba(38, 217, 242, 0.15);
  background: rgba(9, 10, 42, 1);
}

input::placeholder {
  color: rgba(181, 179, 215, 0.4);
}

/* select 选项颜色 */
select option {
  background: var(--bg-surface);
  color: var(--text-primary);
}

/* 按钮系统 */
.btn {
  padding: 9px 22px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-magenta), var(--neon-violet));
  color: #fff;
  box-shadow: 0 4px 16px rgba(244, 56, 184, 0.4);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(244, 56, 184, 0.6);
  filter: brightness(1.1);
}

.btn-primary:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(244, 56, 184, 0.4);
}

.btn-primary:disabled {
  background: rgba(138, 77, 255, 0.15);
  color: var(--text-secondary);
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
  filter: none;
}

/* 热门推荐 chips */
.suggest-title {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  font-weight: 600;
}

.suggest-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid rgba(38, 217, 242, 0.2);
  background: rgba(38, 217, 242, 0.05);
  color: var(--text-secondary);
  transition: all 0.2s;
  font-weight: 500;
}

.chip:hover {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  background: rgba(38, 217, 242, 0.12);
  box-shadow: 0 0 8px rgba(38, 217, 242, 0.3);
}

.chip .cnt {
  font-size: 10px;
  color: rgba(181, 179, 215, 0.5);
  margin-left: 4px;
}

/* ============================================
   结果卡片 - 双色霓虹边框
   ============================================ */

/* 青色主边框 + 品红角标 */
.result-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(38, 217, 242, 0.3);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 24px;
  position: relative;
  box-shadow: 0 0 0 0 transparent, inset 0 0 32px rgba(38, 217, 242, 0.03);
  transition: box-shadow 0.3s;
}

/* 品红角标 */
.result-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 14px;
  height: 14px;
  background: var(--neon-magenta);
  clip-path: polygon(0 0, 100% 0, 0 100%);
  border-radius: 8px 0 0 0;
  z-index: 1;
}

.result-card:hover {
  box-shadow: 0 0 20px rgba(38, 217, 242, 0.12);
}

.result-header {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(38, 217, 242, 0.15);
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(9, 10, 42, 0.4);
}

.total {
  color: var(--neon-cyan);
  font-weight: 700;
  text-shadow: 0 0 8px rgba(38, 217, 242, 0.6);
}

/* 阵容列表项 */
.run-item {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.1);
  display: flex;
  gap: 12px;
  align-items: center;
  transition: background 0.15s;
}

.run-item:hover {
  background: rgba(244, 56, 184, 0.05);
}

.run-item:last-child {
  border-bottom: none;
}

.run-hero {
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  background: rgba(244, 56, 184, 0.12);
  color: var(--neon-magenta);
  border: 1px solid rgba(244, 56, 184, 0.35);
}

.run-meta {
  flex: 1;
  min-width: 0;
}

.run-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 3px;
}

.run-items {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 胜率徽章 */
.win-badge {
  font-size: 14px;
  font-weight: 800;
  text-align: right;
  white-space: nowrap;
  min-width: 48px;
}

.win-badge .sub {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  display: block;
  margin-top: 1px;
}

/* 分页按钮 */
.pagination {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

.page-btn {
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid rgba(138, 77, 255, 0.3);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.page-btn:hover {
  border-color: var(--neon-violet);
  color: var(--neon-violet);
  background: rgba(138, 77, 255, 0.1);
}

.page-btn.active {
  background: var(--neon-violet);
  color: #fff;
  border-color: var(--neon-violet);
  box-shadow: var(--glow-violet);
}

.page-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* 胜率查询 - 偏电光青 */
.winrate-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(38, 217, 242, 0.3);
  border-radius: 8px;
  padding: 36px;
  text-align: center;
  margin-bottom: 24px;
  position: relative;
}

.winrate-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 14px;
  height: 14px;
  background: var(--neon-magenta);
  clip-path: polygon(0 0, 100% 0, 0 100%);
  border-radius: 8px 0 0 0;
}

.winrate-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
}

.winrate-big {
  font-size: 72px;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 8px;
  text-shadow: 0 0 40px currentColor;
}

.winrate-bar-wrap {
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 8px;
  width: 320px;
  margin: 20px auto;
  overflow: hidden;
  position: relative;
}

.winrate-bar-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid rgba(38, 217, 242, 0.2);
  border-radius: 4px;
}

.winrate-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.winrate-bar::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  width: 4px;
  height: 100%;
  background: rgba(255,255,255,0.6);
  border-radius: 0 4px 4px 0;
}

.winrate-stats {
  display: flex;
  gap: 48px;
  justify-content: center;
  margin-top: 24px;
}

.winrate-stat .num {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-primary);
}

.winrate-stat .lbl {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* 最佳搭档 - 偏青绿色 */
.partner-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--neon-teal);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 10px 20px 8px;
  border-bottom: 1px solid rgba(54, 227, 193, 0.15);
  background: rgba(54, 227, 193, 0.04);
}

.partner-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.1);
  transition: background 0.15s;
}

.partner-item:hover {
  background: rgba(54, 227, 193, 0.05);
}

.partner-item:last-child {
  border-bottom: none;
}

.partner-rank {
  font-size: 18px;
  width: 28px;
  text-align: center;
  color: var(--text-secondary);
  font-weight: 700;
}

.partner-name {
  flex: 1;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.partner-rate {
  font-size: 15px;
  font-weight: 800;
}

.partner-sub {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.partner-bar-wrap {
  width: 80px;
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 5px;
  overflow: hidden;
}

.partner-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  background: var(--neon-teal);
  box-shadow: 0 0 6px var(--neon-teal);
}

/* 职业榜单 - 偏紫罗兰 */
.topcard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  margin-top: 0;
}

.topcard-hero-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(138, 77, 255, 0.35);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.topcard-hero-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-violet);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
  border-radius: 0 8px 0 0;
}

.topcard-hero-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.2);
  background: rgba(9, 10, 42, 0.5);
}

.topcard-hero-name {
  font-size: 15px;
  font-weight: 800;
  color: var(--neon-violet);
  text-shadow: var(--glow-violet);
}

.topcard-hero-runs {
  font-size: 11px;
  color: var(--text-secondary);
}

.topcard-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid rgba(138, 77, 255, 0.08);
  transition: background 0.15s;
}

.topcard-item:hover {
  background: rgba(138, 77, 255, 0.05);
}

.topcard-item:last-child {
  border-bottom: none;
}

.topcard-rank {
  font-size: 16px;
  width: 24px;
  text-align: center;
  flex-shrink: 0;
  color: var(--text-secondary);
  font-weight: 700;
}

.topcard-name {
  flex: 1;
  min-width: 0;
}

.topcard-name-zh {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topcard-name-en {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topcard-rate-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.topcard-rate {
  font-size: 14px;
  font-weight: 800;
}

.topcard-sub {
  font-size: 10px;
  color: var(--text-secondary);
}

.topcard-bar-wrap {
  width: 60px;
  background: rgba(138, 77, 255, 0.1);
  border-radius: 4px;
  height: 4px;
  overflow: hidden;
}

.topcard-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}

/* 意见反馈 - 偏珊瑚红和品红 */
.fb-form-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--neon-coral);
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.fb-form-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  background: var(--neon-magenta);
  border-radius: 2px;
  box-shadow: var(--glow-magenta);
}

.fb-textarea {
  width: 100%;
  min-height: 100px;
  background: rgba(9, 10, 42, 0.8);
  border: 1px solid rgba(255, 83, 106, 0.3);
  border-radius: 6px;
  padding: 12px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: all 0.2s;
  margin-bottom: 10px;
}

.fb-textarea:focus {
  border-color: var(--neon-coral);
  box-shadow: 0 0 0 2px rgba(255, 83, 106, 0.15);
  background: rgba(9, 10, 42, 1);
}

.fb-contact-input {
  width: 100%;
  margin-bottom: 12px;
}

.fb-submit-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--neon-coral), var(--neon-magenta));
  color: #fff;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(255, 83, 106, 0.4);
}

.fb-submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(255, 83, 106, 0.6);
  filter: brightness(1.1);
}

.fb-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.fb-card {
  background: rgba(23, 16, 71, 0.7);
  border: 1px solid rgba(255, 83, 106, 0.3);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 12px;
  position: relative;
}

.fb-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-magenta);
  clip-path: polygon(0 0, 100% 0, 0 100%);
  border-radius: 8px 0 0 0;
}

.fb-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.fb-card-content {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.6;
  margin-bottom: 10px;
}

.fb-card-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid rgba(138, 77, 255, 0.15);
}

.fb-like-btn {
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid rgba(255, 83, 106, 0.3);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.fb-like-btn:hover {
  border-color: var(--neon-coral);
  color: var(--neon-coral);
  background: rgba(255, 83, 106, 0.08);
}

.fb-like-btn.liked {
  border-color: var(--neon-coral);
  color: var(--neon-coral);
  background: rgba(255, 83, 106, 0.15);
}

/* 通用状态 - Loading / Empty / Error */
.loading {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.loading::before {
  content: '⚡';
  display: block;
  font-size: 32px;
  margin-bottom: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

.empty::before {
  content: '🔍';
  display: block;
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.error-msg {
  background: rgba(255, 83, 106, 0.08);
  border: 1px solid rgba(255, 83, 106, 0.35);
  border-radius: 6px;
  padding: 12px 16px;
  color: var(--neon-coral);
  font-size: 13px;
  margin-bottom: 16px;
  position: relative;
}

.error-msg::before {
  content: '⚠';
  margin-right: 6px;
  font-size: 16px;
}

/* 链接样式 */
.run-link {
  font-size: 12px;
  color: var(--neon-cyan);
  text-decoration: none;
  white-space: nowrap;
  font-weight: 600;
  transition: color 0.2s;
}

.run-link:hover {
  color: var(--neon-teal);
  text-shadow: 0 0 8px rgba(38, 217, 242, 0.5);
}

/* Footer */
footer {
  margin-top: 60px;
  padding: 30px 20px;
  border-top: 1px solid rgba(138, 77, 255, 0.2);
  text-align: center;
  color: var(--text-secondary);
  font-size: 12px;
  position: relative;
  z-index: 2;
}

footer a {
  color: var(--neon-cyan);
  text-decoration: none;
  margin: 0 15px;
  transition: color 0.2s;
}

footer a:hover {
  color: var(--neon-teal);
  text-shadow: 0 0 8px rgba(38, 217, 242, 0.5);
}

/* 移动端适配 (< 768px) */
@media (max-width: 768px) {
  .navbar {

/* 职业榜单筛选控件 - 横向排列 */
.topcard-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.topcard-controls .form-group {
  min-width: 140px;
}

/* 意见反馈双列布局 */
.fb-layout {
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 24px;
}

.fb-form-card {
  background: var(--bg-surface);
  border: 1px solid rgba(255, 83, 106, 0.35);
  border-radius: 8px;
  padding: 20px;
  position: relative;
  box-shadow: inset 0 0 40px rgba(255, 83, 106, 0.04);
  position: sticky;
  top: 80px;
}

.fb-form-card::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 12px;
  height: 12px;
  background: var(--neon-magenta);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
  border-radius: 0 8px 0 0;
}

.fb-success {
  display: none;
  background: rgba(54, 227, 193, 0.12);
  border: 1px solid var(--neon-teal);
  border-radius: 6px;
  padding: 10px 14px;
  color: var(--neon-teal);
  font-size: 13px;
  margin-bottom: 12px;
  text-align: center;
  font-weight: 600;
}

.fb-upload-area {
  margin-bottom: 10px;
  position: relative;
}

.fb-upload-area input[type="file"] {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 40px;
  cursor: pointer;
  z-index: 2;
}

.fb-upload-hint {
  border: 1px dashed rgba(255, 83, 106, 0.3);
  border-radius: 6px;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}

.fb-upload-hint:hover {
  border-color: var(--neon-coral);
  background: rgba(255, 83, 106, 0.05);
}

.fb-preview {
  display: none;
  max-width: 100%;
  max-height: 200px;
  border-radius: 6px;
  margin-top: 10px;
  border: 1px solid rgba(138, 77, 255, 0.2);
}

.fb-load-more {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid rgba(255, 83, 106, 0.3);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  margin-top: 16px;
}

.fb-load-more:hover {
  border-color: var(--neon-coral);
  color: var(--neon-coral);
  background: rgba(255, 83, 106, 0.08);
}

.masonry {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* 移动端：意见反馈改为单列 */
@media (max-width: 768px) {
  .fb-layout {
    grid-template-columns: 1fr;
  }

  .fb-form-card {
    position: static;
  }

  .topcard-controls {
    flex-direction: column;
  }

  .topcard-controls .form-group {
    width: 100%;
  }
}

/* ============================================
   输入框统一修复
   ============================================ */

/* number 输入框：隐藏原生上下箭头，改用自定义颜色 */
input[type="number"] {
  -moz-appearance: textfield;
}

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* 文件选择按钮：完全隐藏原生 input，用 fb-upload-hint 代替 */
input[type="file"] {
  display: none;
}

/* 让 fb-upload-area 整体可点击 */
.fb-upload-area {
  cursor: pointer;
}

.fb-upload-area label {
  cursor: pointer;
  display: block;
}

/* ============================================
   评论 / 回复 / 发送 按钮
   ============================================ */

/* 评论按钮 - 小型，珊瑚红风格 */
.fb-comment-btn {
  padding: 4px 12px;
  border-radius: 4px;
  border: 1px solid rgba(255, 83, 106, 0.3);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.fb-comment-btn:hover {
  border-color: var(--neon-coral);
  color: var(--neon-coral);
  background: rgba(255, 83, 106, 0.08);
}

/* 回复按钮 - 更小，品红风格 */
.fb-reply-btn {
  padding: 3px 10px;
  border-radius: 4px;
  border: 1px solid rgba(244, 56, 184, 0.25);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: all 0.2s;
  font-family: inherit;
}

.fb-reply-btn:hover {
  border-color: var(--neon-magenta);
  color: var(--neon-magenta);
  background: rgba(244, 56, 184, 0.08);
}

/* 发送按钮 - 青色风格 */
.fb-comment-submit {
  padding: 6px 18px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-teal));
  color: var(--bg-deep);
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: 0 2px 10px rgba(38, 217, 242, 0.3);
}

.fb-comment-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(38, 217, 242, 0.5);
  filter: brightness(1.1);
}

/* 评论输入框 */
.fb-comment-input {
  flex: 1;
  background: rgba(9, 10, 42, 0.8);
  border: 1px solid rgba(38, 217, 242, 0.2);
  border-radius: 6px;
  padding: 7px 12px;
  color: var(--text-primary);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
  min-width: 0;
}

.fb-comment-input:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 2px rgba(38, 217, 242, 0.1);
}

.fb-comment-input::placeholder {
  color: rgba(181, 179, 215, 0.4);
}

/* 评论区域容器 */
.fb-comment-box {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}

/* 评论列表 */
.fb-comment-list {
  margin-top: 10px;
  padding: 10px 0 0;
  border-top: 1px solid rgba(138, 77, 255, 0.1);
}

.fb-comment-item {
  padding: 8px 12px;
  border-left: 2px solid rgba(38, 217, 242, 0.2);
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--text-primary);
  background: rgba(9, 10, 42, 0.3);
  border-radius: 0 4px 4px 0;
}

.fb-comment-meta {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 3px;
}

/* === 职业 tab === */
.hero-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;border-bottom:2px solid rgba(138,77,255,.2);padding-bottom:8px;}
.hero-tab{padding:10px 18px;border-radius:6px 6px 0 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-secondary);border:1px solid transparent;background:transparent;transition:all .25s;font-family:inherit;}
.hero-tab:hover{color:var(--text-primary);background:rgba(138,77,255,.08);}
.hero-tab.active{color:var(--neon-violet);background:rgba(138,77,255,.15);border-color:rgba(138,77,255,.4);border-bottom-color:transparent;}

/* === 二级内容 tab === */
.content-tabs{display:flex;gap:10px;margin-bottom:20px;}
.content-tab{padding:8px 22px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid rgba(38,217,242,.25);background:transparent;transition:all .2s;font-family:inherit;}
.content-tab:hover{color:var(--neon-cyan);background:rgba(38,217,242,.08);}
.content-tab.active{color:var(--text-primary);background:linear-gradient(135deg,rgba(38,217,242,.15),rgba(244,56,184,.1));border-color:var(--neon-cyan);box-shadow:0 0 12px rgba(38,217,242,.3);}

/* === n 滑块 === */
.slider-group{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.slider-group label{font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.slider-wrapper{display:flex;align-items:center;gap:10px;}
input[type="range"]{-webkit-appearance:none;appearance:none;width:160px;height:6px;background:rgba(138,77,255,.2);border-radius:3px;outline:none;padding:0;min-width:auto;border:none;}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--neon-cyan);border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(38,217,242,.6);transition:all .2s;}
input[type="range"]::-moz-range-thumb{width:18px;height:18px;background:var(--neon-cyan);border:none;border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(38,217,242,.6);}
.slider-value{font-size:18px;font-weight:800;color:var(--neon-cyan);min-width:28px;text-align:center;text-shadow:0 0 8px rgba(38,217,242,.5);}
.slider-hint{font-size:12px;color:var(--text-secondary);}

/* === 阵容组 === */
.comp-group{background:rgba(23,16,71,.7);border:1px solid rgba(138,77,255,.3);border-radius:8px;margin-bottom:14px;overflow:hidden;transition:all .2s;position:relative;}
.comp-group::before{content:'';position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:var(--neon-violet);clip-path:polygon(100% 0,0 0,100% 100%);border-radius:0 8px 0 0;}
.comp-group:hover{border-color:rgba(138,77,255,.55);box-shadow:0 0 16px rgba(138,77,255,.2);}
.comp-group-header{padding:14px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;background:rgba(9,10,42,.35);}
.comp-rank{font-size:18px;width:28px;text-align:center;flex-shrink:0;color:var(--text-secondary);font-weight:700;}
.comp-rep-cards{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0;}
.comp-card-chip{padding:3px 9px;border-radius:4px;font-size:12px;font-weight:600;background:rgba(138,77,255,.12);color:var(--text-primary);border:1px solid rgba(138,77,255,.3);white-space:nowrap;}
.comp-card-chip.has-img{padding:3px 6px;display:flex;align-items:center;gap:4px;}
.comp-card-chip.is-new{background:rgba(244,56,184,0.25);border-color:rgba(244,56,184,0.8);color:#F438B8;font-weight:700;box-shadow:0 0 6px rgba(244,56,184,0.4);}
.comp-card-img{object-fit:contain;border-radius:3px;flex-shrink:0;display:block;}
.comp-card-img.size-Small{width:16px;height:32px;}
.comp-card-img.size-Medium{width:32px;height:32px;}
.comp-card-img.size-Large{width:48px;height:32px;}
.comp-stats{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.comp-rate{font-size:18px;font-weight:800;}
.comp-count{font-size:12px;color:var(--text-secondary);text-align:right;}
.comp-expand-icon{font-size:13px;color:var(--text-secondary);transition:transform .3s;flex-shrink:0;}
.comp-group.expanded>.comp-group-header .comp-expand-icon{transform:rotate(180deg);}
.comp-variants{display:none;padding:14px 20px;border-top:1px solid rgba(138,77,255,.15);}
.comp-group.expanded>.comp-variants{display:block;}
.comp-variant-item{padding:12px;background:rgba(9,10,42,.5);border-radius:6px;margin-bottom:10px;border:1px solid rgba(138,77,255,.2);}
.comp-variant-item:last-child{margin-bottom:0;}
.variant-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.variant-label{font-size:12px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.variant-stats{display:flex;gap:14px;align-items:center;}
.variant-rate{font-size:14px;font-weight:800;}
.variant-count{font-size:12px;color:var(--text-secondary);}
.variant-cards{display:flex;gap:8px;flex-wrap:wrap;}
.variant-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;background:rgba(138,77,255,.08);border-radius:5px;border:1px solid rgba(138,77,255,.25);min-width:64px;max-width:88px;}
.variant-card img{object-fit:contain;border-radius:4px;flex-shrink:0;}
.variant-card img.size-Small{width:18px;height:36px;}
.variant-card img.size-Medium{width:36px;height:36px;}
.variant-card img.size-Large{width:54px;height:36px;}
.variant-card-name{font-size:11px;font-weight:600;color:var(--text-primary);text-align:center;line-height:1.3;}
.variant-card-sub{font-size:9px;color:var(--text-secondary);text-align:center;}
.variant-card-enchant{font-size:9px;color:var(--neon-gold);text-align:center;}
.variant-card.is-core {
  border: 2px solid var(--neon-magenta);
  background: rgba(244, 56, 184, 0.12);
  box-shadow: 0 0 8px rgba(244, 56, 184, 0.4);
  position: relative;
}
.variant-card.is-core::before {
  content: '⭐';
  position: absolute;
  top: 2px;
  right: 2px;
  font-size: 10px;
  color: var(--neon-magenta);
}


/* === comp 空/加载 === */
.comp-empty{text-align:center;padding:48px 20px;color:var(--text-secondary);font-size:14px;}
.comp-empty::before{content:'🔍';display:block;font-size:36px;margin-bottom:12px;opacity:.5;}
.comp-progress-wrap{padding:32px 20px;text-align:center;}
.comp-progress-bar-bg{width:100%;max-width:320px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin:12px auto 8px;overflow:hidden;}
.comp-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--neon-violet),var(--neon-cyan));border-radius:3px;transition:width 0.3s ease;animation:comp-progress-pulse 1.5s ease-in-out infinite;}
@keyframes comp-progress-pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.comp-progress-label{font-size:12px;color:var(--text-secondary);}

/* === 移动端 === */
@media(max-width:768px){
  .hero-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;}
  .hero-tabs::-webkit-scrollbar{display:none;}
  .hero-tab{flex-shrink:0;}
  .comp-group-header{flex-wrap:wrap;gap:10px;}

  align-items: center;
  gap: 8px;
}
.overview-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: var(--neon-cyan);

}
.overview-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.overview-controls .form-group {

<script>

// fingerprint
function getFingerprint(){
  let fp=localStorage.getItem('_bz_fp');
  if(!fp){fp='fp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);localStorage.setItem('_bz_fp',fp);}
  return fp;
}
const _origFetch=window.fetch;
window.fetch=function(url,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  if(typeof opts.headers==='object'&&!(opts.headers instanceof Headers))opts.headers['X-Fingerprint']=getFingerprint();
  return _origFetch(url,opts);
};

function trackPV(tab){
  fetch('/api/track/pv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tab})}).catch(()=>{});
}

// 全局变量
let currentHero = 'Vanessa';
let currentContent = 'topcard';
// compN已移除
const _topcardCache = {};
const _compCache = {};
const TIER_COLOR = {Diamond:'#26D9F2',Gold:'#F5C76A',Silver:'#B5B3D7',Bronze:'#cd7f32',Legendary:'#F438B8'};

function rateColor(r){
  if(r>=0.65)return'var(--neon-teal)';
  if(r>=0.5)return'var(--neon-gold)';
  return'var(--neon-coral)';
}

// 职业切换
function switchHero(hero, el){
  currentHero=hero;
  document.querySelectorAll('.hero-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  delete _topcardCache[hero];
  delete _compCache[hero];
  if(currentContent==='topcard')loadTopcard();
  else loadComp();
}

// 内容切换
function switchContent(type){
  currentContent=type;
  document.getElementById('tab-topcard').classList.toggle('active',type==='topcard');
  document.getElementById('tab-comp').classList.toggle('active',type==='comp');
  document.getElementById('panel-topcard').style.display=type==='topcard'?'block':'none';
  document.getElementById('panel-comp').style.display=type==='comp'?'block':'none';
  if(type==='topcard')loadTopcard();
  else loadComp();
}

// 滑块
function onSliderChange(val){
  compN=parseInt(val);
  document.getElementById('comp-n-val').textContent=val;
  document.getElementById('comp-n-label').textContent=val;
  clearTimeout(_sliderTimer);
  _sliderTimer=setTimeout(loadComp,400);
}

// ── 卡牌榜 ──

// ── 职业概况 ──
const _overviewCache = {};

async function loadOverview() {
  const days = document.getElementById('overview-days')?.value || '';
  const rank = document.getElementById('overview-rank')?.value || 'legendary';
  const sort = document.getElementById('overview-sort')?.value || 'total';
  const key = days + '_' + rank;

  // 已有缓存，直接前端排序渲染
  if (_overviewCache[key]) {
    renderOverview(_overviewCache[key], sort);
    return;
  }

  const el = document.getElementById('overview-result');
  el.innerHTML = '<div class="loading">加载中...</div>';

  // 不传 sort_by，后端只负责返回原始数据
  const p = new URLSearchParams({ rank: rank });
  if (days) p.set('days', days);

  try {
    const r = await fetch('/api/hero_overview?' + p);
    const d = await r.json();
    if (d.error) {
      el.innerHTML = '<div class="error-msg">' + d.error + '</div>';
      return;
    }
    _overviewCache[key] = d;
    renderOverview(d, sort);
  } catch (e) {
    el.innerHTML = '<div class="error-msg">请求失败: ' + e.message + '</div>';
  }
}

function renderOverview(data, sortBy) {
  let heroes = [...(data.heroes || [])];
  if (!heroes.length) {
    document.getElementById('overview-result').innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }

  // 前端排序
  if (sortBy === 'rate') {
    heroes.sort((a, b) => b.rate - a.rate || b.total - a.total);
  } else if (sortBy === 'wins') {
    heroes.sort((a, b) => b.wins - a.wins || b.rate - a.rate);
  } else {
    heroes.sort((a, b) => b.total - a.total || b.rate - a.rate);
  }

  const cards = heroes.map((h, i) => {
    const rankCls = i < 3 ? ' rank-' + (i + 1) : '';
    const rate = (h.rate * 100).toFixed(1);
    const rateColor = h.rate >= 0.55 ? 'rate-high' : (h.rate >= 0.45 ? 'rate-mid' : 'rate-low');
    
    const maxVal = Math.max(...heroes.map(x => x[sortBy === 'rate' ? 'rate' : sortBy]));
    const barWidth = sortBy === 'rate' 
      ? Math.round((h.rate / maxVal) * 100)
      : Math.round((h[sortBy] / maxVal) * 100);
    const barColor = rateColor.replace('rate-', '');
    const barColorMap = { high: 'var(--neon-teal)', mid: 'var(--neon-gold)', low: 'var(--neon-coral)' };
    
    return `<div class="overview-card${rankCls}" onclick="jumpToHero('${h.hero}')">
      <div class="overview-hero">${h.hero_zh}</div>
      <div class="overview-stats">
        <div class="overview-stat${sortBy === 'total' ? ' highlight' : ''}">
          <span class="overview-stat-label">出场</span>
          <span class="overview-stat-value">${h.total.toLocaleString()}</span>
        </div>
        <div class="overview-stat${sortBy === 'wins' ? ' highlight' : ''}">
          <span class="overview-stat-label">胜场</span>
          <span class="overview-stat-value">${h.wins.toLocaleString()}</span>
        </div>
        <div class="overview-stat${sortBy === 'rate' ? ' highlight' : ''}">
          <span class="overview-stat-label">胜率</span>
          <span class="overview-stat-value ${rateColor}">${rate}%</span>
        </div>
      </div>
      <div class="overview-bar-wrap">
        <div class="overview-bar" style="width:${barWidth}%;background:${barColorMap[barColor]}"></div>
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('overview-result').innerHTML = '<div class="overview-grid">' + cards + '</div>';
}

function jumpToHero(heroEn) {
  // 切换职业
  currentHero = heroEn;
  document.querySelectorAll('.hero-tab').forEach((t, i) => {
    const heroes = ['Vanessa', 'Dooley', 'Mak', 'Pygmalien', 'Stelle', 'Jules', 'Karnok', 'The Dragons'];
    if (heroes[i] === heroEn) {
      t.classList.add('active');
    } else {
      t.classList.remove('active');
    }
  });
  
  // 清除该职业缓存并加载卡牌榜
  delete _topcardCache[heroEn];
  delete _compCache[heroEn];
  if (currentContent === 'topcard') {
    loadTopcard();
  } else {
    switchContent('topcard');
  }
  
  // 滚动到职业选择器
  document.querySelector('.hero-tabs')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 页面加载时自动加载概况
window.addEventListener('DOMContentLoaded', () => {
  loadOverview();
});

async function loadTopcard(){
  const days=document.getElementById('topcard-days')?.value||'';
  const sort=document.getElementById('topcard-sort')?.value||'total';
  const rank=document.getElementById('topcard-rank')?.value||'legendary';
  const key=currentHero+'_'+days+'_'+sort+'_'+rank;
  if(_topcardCache[key]){renderTopcard(_topcardCache[key]);return;}
  const el=document.getElementById('topcard-result');
  el.innerHTML=`<div class="comp-progress-wrap">
    <div class="comp-progress-label">正在统计卡牌胜率，请稍候...</div>
    <div class="comp-progress-bar-bg"><div class="comp-progress-bar" id="topcard-pbar"></div></div>
    <div class="comp-progress-label" id="topcard-pct">0%</div>
  </div>`;
  let pct=0;
  const timer=setInterval(()=>{
    if(pct<80){
      pct += pct<30 ? 3 : pct<60 ? 1.5 : 0.5;
      const bar=document.getElementById('topcard-pbar');
      const lbl=document.getElementById('topcard-pct');
      if(bar) bar.style.width=pct.toFixed(0)+'%';
      if(lbl) lbl.textContent=pct.toFixed(0)+'%';
    }
  },200);
  const p=new URLSearchParams({hero:currentHero,top:20,sort_by:sort,rank:rank});
  if(days)p.set('days',days);
  try{
    const r=await fetch('/api/topcard?'+p);
    const d=await r.json();
    clearInterval(timer);
    const bar=document.getElementById('topcard-pbar');
    const lbl=document.getElementById('topcard-pct');
    if(bar) bar.style.width='100%';
    if(lbl) lbl.textContent='100%';
    await new Promise(res=>setTimeout(res,300));
    if(d.error){el.innerHTML='<div class="error-msg">'+d.error+'</div>';return;}
    _topcardCache[key]=d;
    renderTopcard(d);
  }catch(e){clearInterval(timer);el.innerHTML='<div class="error-msg">请求失败: '+e.message+'</div>';}
}

function renderTopcard(data){
  const top=data.top||[];
  if(!top.length){document.getElementById('topcard-result').innerHTML='<div class="empty">暂无数据</div>';return;}
  const medals=['🥇','🥈','🥉'];
  const maxRate=top[0]?.rate||1;
  const rows=top.map((item,i)=>{
    const pct=(item.rate*100).toFixed(1);
    const color=rateColor(item.rate);
    const barW=Math.round(item.rate/maxRate*100);
    const imgUrl = item.img || '';
    const sizeCls = 'size-' + (item.size || 'Small');
    const imgHtml = imgUrl ? `<img class="comp-card-img ${sizeCls}" src="${imgUrl}" alt="${item.name_zh}" loading="lazy" onerror="this.style.display='none'">` : '';
    return `<div class="topcard-item">
      <span class="topcard-rank">${medals[i]||i+1}</span>
      ${imgHtml}
      <div class="topcard-name">
        <div class="topcard-name-zh">${item.name_zh}</div>
        <div class="topcard-name-en">${item.name_en}</div>
      </div>
      <div class="topcard-rate-wrap">
        <span class="topcard-rate" style="color:${color}">${pct}%</span>
        <span class="topcard-sub">${item.ten_win}/${item.total}</span>
        <div class="topcard-bar-wrap"><div class="topcard-bar" style="width:${barW}%;background:${color}"></div></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('topcard-result').innerHTML=`
    <div class="topcard-hero-card">
      <div class="topcard-hero-header">
        <span class="topcard-hero-name">专属卡牌胜率榜</span>
        <span class="topcard-hero-runs">共 ${data.total_runs} 局</span>
      </div>
      ${rows}
    </div>`;
}

// ── 阵容榜 ──
async function loadComp(){
  const rank=document.getElementById('comp-rank')?.value||'legendary';
  const key=currentHero+'_'+rank;
  if(_compCache[key]){renderComp(_compCache[key]);return;}

  // 进度条
  const el=document.getElementById('comp-result');
  el.innerHTML=`<div class="comp-progress-wrap">
    <div class="comp-progress-label">正在挖掘阵容数据，请稍候...</div>
    <div class="comp-progress-bar-bg"><div class="comp-progress-bar" id="comp-pbar"></div></div>
    <div class="comp-progress-label" id="comp-pct">0%</div>
  </div>`;

  // 模拟进度（实际是单次请求，用定时器推进）
  let pct=0;
  const timer=setInterval(()=>{
    // 前80%匀速推进，留20%给实际返回
    if(pct<80){
      pct += pct<30 ? 3 : pct<60 ? 1.5 : 0.5;
      const bar=document.getElementById('comp-pbar');
      const lbl=document.getElementById('comp-pct');
      if(bar) bar.style.width=pct.toFixed(0)+'%';
      if(lbl) lbl.textContent=pct.toFixed(0)+'%';
    }
  },200);

  const p=new URLSearchParams({hero:currentHero,rank:rank});
  try{
    const r=await fetch('/api/comp?'+p);
    const d=await r.json();
    clearInterval(timer);
    // 完成动画
    const bar=document.getElementById('comp-pbar');
    const lbl=document.getElementById('comp-pct');
    if(bar) bar.style.width='100%';
    if(lbl) lbl.textContent='100%';
    await new Promise(res=>setTimeout(res,300));
    if(d.error){el.innerHTML='<div class="error-msg">'+d.error+'</div>';return;}
    _compCache[key]=d;
    renderComp(d);
  }catch(e){
    clearInterval(timer);
    el.innerHTML='<div class="error-msg">请求失败: '+e.message+'</div>';
  }
}

function renderComp(data){
  const layers=data.layers||[];
  if(!layers.length){
    document.getElementById('comp-result').innerHTML='<div class="comp-empty">暂无满足条件的阵容数据<br><small>核心卡组合需出现≥50次</small></div>';
    return;
  }
  const medals=['🥇','🥈','🥉'];

  function chips(cards){
    return cards.map(c=>{
      const cls = c.is_new ? 'comp-card-chip is-new' : 'comp-card-chip';
      if(c.img){
        const sizeCls='size-'+(c.size||'Small');
        return `<span class="${cls} has-img"><img class="comp-card-img ${sizeCls}" src="${c.img}" alt="${c.name_zh}" loading="lazy" onerror="this.style.display='none'">${c.name_zh}</span>`;
      }
      return `<span class="${cls}">${c.name_zh}</span>`;
    }).join('');
  }

  function screenshotBtn(id, url){
    if(!url) return '';
    return `<div style="margin-top:8px">
      <button onclick="toggleScreenshot('${id}')" style="background:none;border:1px solid rgba(38,217,242,0.3);border-radius:4px;color:var(--text-secondary);font-size:11px;padding:3px 10px;cursor:pointer;font-family:inherit;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--neon-cyan)';this.style.color='var(--neon-cyan)'" onmouseout="this.style.borderColor='rgba(38,217,242,0.3)';this.style.color='var(--text-secondary)'">
        📷 查看截图 <span id="${id}-icon">▼</span>
      </button>
      <div id="${id}" style="display:none;margin-top:8px">
        <img src="https://usercontent.bzdb.network${url}" style="max-width:100%;border-radius:6px;border:1px solid rgba(138,77,255,0.3)" loading="lazy" onerror="this.parentElement.style.display='none'">
      </div>
    </div>`;
  }

  function renderConfigs(configs, prefix){
    if(!configs||!configs.length) return '<div style="font-size:12px;color:var(--text-secondary);padding:8px 0">暂无具体配置数据</div>';
    return configs.map((v,vi)=>{
      const id=`${prefix}-cfg-${vi}`;
      const cardHtml=chips(v.cards);
      return `<div class="comp-variant-item">
        <div class="variant-header">
          <span class="variant-label">配置 ${vi+1}</span>
          <div class="variant-stats">
            <span class="variant-rate" style="color:${rateColor(v.rate)}">${(v.rate*100).toFixed(1)}% 胜率</span>
            <span class="variant-count">${v.count}次出场</span>
          </div>
        </div>
        <div class="comp-rep-cards" style="margin-top:6px;flex-wrap:wrap">${cardHtml}</div>
        ${screenshotBtn(id, v.screenshot)}
      </div>`;
    }).join('');
  }

  function renderL3(l3list, prefix){
    if(!l3list||!l3list.length) return '';
    return l3list.map((l3,k)=>{
      const id=`${prefix}-l3-${k}`;
      const cfgHtml=renderConfigs(l3.configs, id);
      return `<div class="comp-group" id="${id}" style="margin:8px 0;border-color:rgba(38,217,242,0.25)">
        <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')" style="background:rgba(9,10,42,0.5);padding:10px 16px">
          <span style="font-size:12px;color:var(--text-secondary);flex-shrink:0">L3</span>
          <div class="comp-rep-cards" style="flex:1">${chips(l3.core_cards)}</div>
          <div class="comp-stats">
            <div>
              <div class="comp-rate" style="color:${rateColor(l3.rate)};font-size:14px">${(l3.rate*100).toFixed(1)}%</div>
              <div class="comp-count">${l3.count}次</div>
            </div>
            <span class="comp-expand-icon">▼</span>
          </div>
        </div>
        <div class="comp-variants" style="padding:12px 16px;background:rgba(0,0,0,0.2)">${cfgHtml}</div>
      </div>`;
    }).join('');
  }

  function renderL2(l2list, prefix){
    if(!l2list||!l2list.length) return '<div style="font-size:12px;color:var(--text-secondary);padding:8px">暂无变种数据</div>';
    return l2list.map((l2,j)=>{
      const id=`${prefix}-l2-${j}`;
      const l3Html=renderL3(l2.l3_variants, id);
      // L3 为空时用兜底配置
      const l2InnerHtml = l3Html || renderConfigs(l2.configs, id);
      return `<div class="comp-group" id="${id}" style="margin:8px 0;border-color:rgba(244,56,184,0.25)">
        <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')" style="background:rgba(9,10,42,0.45);padding:10px 16px">
          <span style="font-size:12px;color:var(--text-secondary);flex-shrink:0">L2</span>
          <div class="comp-rep-cards" style="flex:1">${chips(l2.core_cards)}</div>
          <div class="comp-stats">
            <div>
              <div class="comp-rate" style="color:${rateColor(l2.rate)};font-size:14px">${(l2.rate*100).toFixed(1)}%</div>
              <div class="comp-count">${l2.count}次</div>
            </div>
            <span class="comp-expand-icon">▼</span>
          </div>
        </div>
        <div class="comp-variants" style="padding:12px 16px">${l2InnerHtml||'<div style="font-size:12px;color:var(--text-secondary)">暂无数据</div>'}</div>
      </div>`;
    }).join('');
  }

  const html=layers.map((l1,i)=>{
    const id=`comp-l1-${i}`;
    const l2Html=renderL2(l1.l2_variants, id);
    return `<div class="comp-group" id="${id}">
      <div class="comp-group-header" onclick="document.getElementById('${id}').classList.toggle('expanded')">
        <span class="comp-rank">${medals[i]||i+1}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:var(--text-secondary);margin-bottom:4px">L1 体系</div>
          <div class="comp-rep-cards">${chips(l1.core_cards)}</div>
        </div>
        <div class="comp-stats">
          <div>
            <div class="comp-rate" style="color:${rateColor(l1.rate)}">${(l1.rate*100).toFixed(1)}%</div>
            <div class="comp-count">评分${(l1.score*100).toFixed(0)} · ${l1.count}次</div>
          </div>
          <span class="comp-expand-icon">▼</span>
        </div>
      </div>
      <div class="comp-variants">${l2Html}</div>
    </div>`;
  }).join('');

  document.getElementById('comp-result').innerHTML=`
    <div style="margin-bottom:10px;font-size:12px;color:var(--text-secondary)">
      共 ${data.total_runs} 局 · L1体系严格互斥 · 综合评分排序
    </div>
    ${html}`;
}

function toggleScreenshot(id){
  const el = document.getElementById(id);
  const icon = document.getElementById(id+'-icon');
  if(!el) return;
  const visible = el.style.display !== 'none';
  el.style.display = visible ? 'none' : 'block';
  if(icon) icon.textContent = visible ? '▼' : '▲';
}

function toggleComp(i){
  document.getElementById('comp-g-'+i).classList.toggle('expanded');
}

// ── 初始化 ──
window.addEventListener('DOMContentLoaded',()=>{
  trackPV('topcard');
  loadTopcard();
});
</script>
<script src="/static/announcement.js"></script>
</body>
