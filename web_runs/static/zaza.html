<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>扎扎空间 | 巴扎丘Bot</title><link rel="stylesheet" href="/static/zaza.css"><script src="/static/zaza-cards.js?v=replay1" defer></script><script src="/static/zaza.js?v=replay1" defer></script></head>
<body><nav class="navbar"><a class="logo" href="/">🐉 巴扎丘Bot</a><div class="nav-tabs"><a href="/runs">阵容查询</a><a href="/routes">阵容路线</a><a href="/winrate">胜率查询</a><a href="/partner">最佳搭档</a><a href="/topcard">职业榜单</a><a href="/zaza" aria-current="page">扎扎空间</a><a href="/trivia">冷知识</a></div></nav>
<main><h1>扎扎空间</h1><p class="muted">玩家的公开对局空间 · 统计仅覆盖最新赛季阶段已收集的本地记录。</p>
<div class="columns"><section class="panel"><h2>创建空间</h2><p class="muted">无需登录。名称须以「空间」结尾，名称及个人页不能重复。申请后可公开查看审核状态。</p><form id="create"><label for="profile">BazaarDB 个人页</label><input id="profile" type="url" required placeholder="https://bazaardb.gg/run/profile/UUID" autocomplete="url"><label for="name">空间名称</label><input id="name" required maxlength="48" placeholder="例如 小丘空间"><button id="create-submit">提交申请</button></form><p id="result" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>发现空间</h2><label for="search">搜索名称</label><input id="search" type="search" placeholder="输入空间名称"><p class="muted">包含待审核、创建中、已启用、收集失败和已停止的空间。</p><div id="spaces" class="spaces" aria-live="polite">正在加载…</div><button id="list-refresh" class="secondary">刷新列表</button></section></div>
<section id="detail" class="panel" hidden aria-busy="false"><div class="heading"><h2 id="title">空间详情</h2><button id="detail-refresh" class="secondary">刷新</button><button id="share" class="secondary">复制空间链接</button></div><p id="detail-error" class="error" role="alert"></p><div id="profile-info"></div><p id="scope" class="muted"></p><div id="metrics" class="metrics"></div><div id="hero-distribution" class="tags"></div>
<h3>对局记录</h3><form id="filters" class="filters"><div><label for="hero">职业</label><select id="hero"><option value="">全部职业</option></select></div><div><label for="recent-days">最近 N 天</label><input id="recent-days" type="number" min="1" step="1" placeholder="不限天数" inputmode="numeric"></div><div class="card-filter"><label for="card-search">卡牌组合（同时包含全部所选卡牌）</label><input id="card-search" maxlength="40" autocomplete="off" role="combobox" aria-controls="card-suggestions" aria-expanded="false" placeholder="模糊搜索中文或英文卡名"><div id="card-suggestions" class="suggestions" role="listbox" hidden></div><div id="card-tags" class="tags"></div></div><button>应用筛选</button><button id="reset-filters" type="button" class="secondary">清除筛选</button></form>
<div id="runs" class="runs"></div><div class="pagination"><button id="previous" class="secondary">上一页</button><span id="page-info"></span><button id="next" class="secondary">下一页</button></div><section class="future"><h3>阵容路线 · 即将推出</h3><p class="muted">正在收集对局与逐日快照，路线分析将在后续开放。</p></section></section></main></body></html>
